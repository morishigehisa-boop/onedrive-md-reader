<style>

<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 hidden max-w-[90vw] bg-slate-900 text-white text-sm px-4 py-3 rounded-lg shadow-lg z-50"></div>

<script>
(() => {
"use strict";

/* =========================
   設定
   ========================= */
const CONFIG = {
  CLIENT_ID: "3c6cf6bf-6af7-4bd0-ad41-cca85929f8b6",
  AUTHORITY: "https://login.microsoftonline.com/consumers",
  REDIRECT_URI: window.location.origin + window.location.pathname,
  SCOPES: ["User.Read", "Files.ReadWrite"],
  GRAPH: "https://graph.microsoft.com/v1.0",
  DB_NAME: "OneDriveMarkdownReader",
  DB_VERSION: 1,
  PROGRESS_FILE: "reading-progress.json",
  PAGE_SIZE: 200,
  RENDER_BATCH: 200,
  SAVE_DELAY: 1800
};

const $ = id => document.getElementById(id);
const state = {
  msal: null,
  account: null,
  token: null,
  files: [],
  registeredFiles: [],
  filtered: [],
  listMode: "registered",
  rendered: 0,
  currentFile: null,
  openRequest: 0,
  openController: null,
  scrollTimer: null,
  saveTimer: null,
  saveChain: Promise.resolve(),
  progress: {},
  db: null,
  syncing: false,
  toastTimer: null
};

function showToast(message, ms = 4500) {
  const el = $("toast");
  el.textContent = message;
  el.classList.remove("hidden");
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => el.classList.add("hidden"), ms);
}
function setListStatus(message) { $("list-status").textContent = message; }
function setProgressStatus(message) { $("progress-status").textContent = message; }
function errorMessage(err) {
  if (!err) return "原因不明のエラー";
  return err.message || String(err);
}
function safeText(value) { return String(value ?? ""); }

/* =========================
   IndexedDB：ファイル一覧キャッシュ
   ========================= */
function openDatabase() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(CONFIG.DB_NAME, CONFIG.DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("items")) db.createObjectStore("items", { keyPath: "id" });
      if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "key" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGet(storeName, key) {
  return new Promise((resolve, reject) => {
    const tx = state.db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const tx = state.db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function idbPutMany(storeName, records) {
  return new Promise((resolve, reject) => {
    const tx = state.db.transaction(storeName, "readwrite");
    const store = tx.objectStore(storeName);
    records.forEach(record => store.put(record));
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}
function idbDeleteMany(storeName, ids) {
  return new Promise((resolve, reject) => {
    const tx = state.db.transaction(storeName, "readwrite");
    const store = tx.objectStore(storeName);
    ids.forEach(id => store.delete(id));
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
function idbSetMeta(key, value) {
  return idbPutMany("meta", [{ key, value }]);
}

/* =========================
   MSAL認証
   ========================= */
async function initAuth() {
  if (!window.msal || !window.msal.PublicClientApplication) {
    throw new Error("MSALライブラリを読み込めません。CDN接続を確認してください。");
  }

  state.msal = new msal.PublicClientApplication({
    auth: {
      clientId: CONFIG.CLIENT_ID,
      authority: CONFIG.AUTHORITY,
      redirectUri: CONFIG.REDIRECT_URI,
      navigateToLoginRequestUrl: true
    },
    cache: {
      cacheLocation: "localStorage",
      storeAuthStateInCookie: false
    },
    system: {
      allowRedirectInIframe: false
    }
  });

  await state.msal.initialize();
  const redirectResult = await state.msal.handleRedirectPromise();

  if (redirectResult && redirectResult.account) {
    state.account = redirectResult.account;
    state.msal.setActiveAccount(state.account);
  } else {
    const accounts = state.msal.getAllAccounts();
    if (accounts.length) {
      state.account = state.msal.getActiveAccount() || accounts[0];
      state.msal.setActiveAccount(state.account);
    }
  }

  if (state.account) {
    await acquireToken();
    setLoggedInUI();
    await startApp();
  }
}
async function login() {
  try {
    await state.msal.loginRedirect({
      scopes: CONFIG.SCOPES,
      prompt: "select_account"
    });
  } catch (err) {
    showToast("ログイン開始エラー：" + errorMessage(err));
  }
}
async function acquireToken() {
  if (!state.account) throw new Error("Microsoftアカウントが選択されていません。");
  try {
    const result = await state.msal.acquireTokenSilent({
      scopes: CONFIG.SCOPES,
      account: state.account
    });
    state.token = result.accessToken;
    return state.token;
  } catch (err) {
    if (err instanceof msal.InteractionRequiredAuthError ||
        err.errorCode === "interaction_required" ||
        err.errorCode === "login_required" ||
        err.errorCode === "consent_required") {
      await state.msal.acquireTokenRedirect({
        scopes: CONFIG.SCOPES,
        account: state.account
      });
      return null;
    }
    throw err;
  }
}
async function logout() {
  if (!state.msal || !state.account) return;
  await state.msal.logoutRedirect({ account: state.account });
}
function setLoggedInUI() {
  $("login-btn").classList.add("hidden");
  $("logout-btn").classList.remove("hidden");
  $("account-label").textContent = state.account?.username || "ログイン中";
  $("sync-btn").disabled = false;
  $("filter-input").disabled = false;
  $("show-registered-btn").disabled = false;
  $("show-search-btn").disabled = false;
}

/* =========================
   Microsoft Graph共通処理
   ========================= */
async function graphRequest(url, options = {}, retryAuth = true) {
  if (!state.token) await acquireToken();
  if (!state.token) throw new Error("アクセストークンを取得できませんでした。");

  const fullUrl = url.startsWith("http") ? url : CONFIG.GRAPH + url;
  const headers = new Headers(options.headers || {});
  headers.set("Authorization", "Bearer " + state.token);

  const response = await fetch(fullUrl, { ...options, headers });

  if (response.status === 401 && retryAuth) {
    state.token = null;
    await acquireToken();
    if (!state.token) throw new Error("再認証が必要です。");
    return graphRequest(url, options, false);
  }

  if (response.status === 429 || response.status === 503 || response.status === 504) {
    const retryAfter = Number(response.headers.get("Retry-After") || 3);
    throw new Error(`Microsoft Graphが一時的に混雑しています（${response.status}）。${retryAfter}秒後に再試行してください。`);
  }

  if (!response.ok) {
    let detail = "";
    try {
      const body = await response.json();
      detail = body.error?.message || body.error?.code || "";
    } catch (_) {}
    throw new Error(`Graph APIエラー ${response.status}${detail ? "：" + detail : ""}`);
  }
  return response;
}
async function graphJson(url, options = {}) {
  const response = await graphRequest(url, options);
  if (response.status === 204) return null;
  return response.json();
}

/* =========================
   Delta同期
   初回はドライブ全体を列挙し、
   2回目以降はdeltaLinkで差分取得
   ========================= */
function toStoredItem(item) {
  return {
    id: item.id,
    name: item.name || "",
    parentId: item.parentReference?.id || null,
    isFolder: !!item.folder,
    isFile: !!item.file,
    size: item.size || 0,
    modified: item.lastModifiedDateTime || "",
    eTag: item.eTag || "",
    cTag: item.cTag || ""
  };
}
async function syncDrive() {
  if (state.syncing) return;
  state.syncing = true;
  $("sync-btn").disabled = true;
  $("sync-btn").textContent = "同期中…";
  setListStatus("OneDriveの変更を確認しています…");

  try {
    let deltaLink = (await idbGet("meta", "deltaLink"))?.value || null;
    let nextUrl = deltaLink || "/me/drive/root/delta?$top=" + CONFIG.PAGE_SIZE;
    let changed = [];
    let deleted = [];
    let pages = 0;
    let finalDeltaLink = null;

    while (nextUrl) {
      pages++;
      setListStatus(`ファイル情報を同期中… ${pages} ページ`);
      let response;
      try {
        response = await graphJson(nextUrl, {
          headers: { "Prefer": "odata.maxpagesize=" + CONFIG.PAGE_SIZE }
        });
      } catch (err) {
        // 古いdelta tokenが無効な場合は初回同期に戻す
        if (deltaLink && /Graph APIエラー (400|410|404)/.test(errorMessage(err))) {
          await idbSetMeta("deltaLink", null);
          deltaLink = null;
          nextUrl = "/me/drive/root/delta?$top=" + CONFIG.PAGE_SIZE;
          changed = [];
          deleted = [];
          pages = 0;
          continue;
        }
        throw err;
      }

      for (const item of (response.value || [])) {
        if (item.deleted) deleted.push(item.id);
        else changed.push(toStoredItem(item));
      }
      nextUrl = response["@odata.nextLink"] || null;
      finalDeltaLink = response["@odata.deltaLink"] || finalDeltaLink;
    }

    if (changed.length) await idbPutMany("items", changed);
    if (deleted.length) await idbDeleteMany("items", deleted);
    if (finalDeltaLink) await idbSetMeta("deltaLink", finalDeltaLink);

    await loadFileIndex();
    const now = new Date();
    await idbSetMeta("lastSync", now.toISOString());
    $("sync-time").textContent = now.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
    setListStatus(`同期完了（変更 ${changed.length} 件 / 削除 ${deleted.length} 件）`);
    showToast("OneDriveのファイル一覧を同期しました。");
  } catch (err) {
    console.error(err);
    setListStatus("同期エラー：" + errorMessage(err));
    showToast("ファイル同期に失敗しました：" + errorMessage(err), 7000);
    // キャッシュがあれば表示を維持する
    await loadFileIndex().catch(console.error);
  } finally {
    state.syncing = false;
    $("sync-btn").disabled = false;
    $("sync-btn").textContent = "一覧を同期";
  }
}

/* =========================
   ファイル一覧・検索・パス
   ========================= */
async function loadFileIndex() {
  const all = await idbGetAll("items");
  const byId = new Map(all.map(x => [x.id, x]));
  const files = all.filter(x => x.isFile && /\.md$/i.test(x.name));

  function getPath(item) {
    const parts = [item.name];
    let parentId = item.parentId;
    let safety = 0;
    while (parentId && byId.has(parentId) && safety++ < 100) {
      const parent = byId.get(parentId);
      if (parent.isFolder && parent.name) parts.unshift(parent.name);
      parentId = parent.parentId;
    }
    return parts.join("/");
  }

  state.files = files.map(item => ({ ...item, path: getPath(item) }))
    .sort((a, b) => a.path.localeCompare(b.path, "ja"));
  refreshRegisteredFiles();
  applyFilter();
}
function applyFilter() {
  const q = $("filter-input").value.trim().toLocaleLowerCase();
  const source = state.listMode === "search" ? state.files : state.registeredFiles;
  state.filtered = q
    ? source.filter(f => f.name.toLocaleLowerCase().includes(q) || f.path.toLocaleLowerCase().includes(q))
    : source.slice();
  state.rendered = 0;
  $("file-count").textContent = `${state.filtered.length.toLocaleString("ja-JP")} 件`;
  $("file-list").innerHTML = "";
  renderMoreFiles();
}
function setListMode(mode) {
  state.listMode = mode;
  const searching = mode === "search";
  $("list-title").textContent = searching ? "OneDrive内を検索" : "登録済み Markdown";
  $("show-registered-btn").className = "flex-1 rounded-lg border px-2 py-2 text-xs " + (!searching ? "bg-blue-50 border-blue-200 text-blue-700" : "hover:bg-slate-50");
  $("show-search-btn").className = "flex-1 rounded-lg border px-2 py-2 text-xs " + (searching ? "bg-blue-50 border-blue-200 text-blue-700" : "hover:bg-slate-50");
  $("filter-input").placeholder = searching ? "OneDrive内のファイル名・フォルダ名を検索" : "登録済みファイルを絞り込み";
  $("filter-input").value = "";
  setListStatus(searching ? "同期済みのOneDrive全体からMarkdownファイルを検索します。未同期の場合は先に同期してください。" : "ここには登録したファイルだけを表示します。登録解除するまで一覧に残ります。");
  applyFilter();
}
async function saveRegistration(file, enabled) {
  const now = new Date().toISOString();
  state.progress.__registrations = state.progress.__registrations || {};
  state.progress.__registrations[file.id] = { enabled, name: file.name, path: file.path, updatedAt: now };
  localStorage.setItem("md_reader_progress_backup", JSON.stringify(state.progress));
  refreshRegisteredFiles();
  applyFilter();
  await queueProgressSave();
}
function refreshRegisteredFiles() {
  const map = new Map(state.files.map(f => [f.id, f]));
  const regs = state.progress.__registrations || {};
  state.registeredFiles = Object.entries(regs)
    .filter(([id, r]) => r && r.enabled)
    .map(([id, r]) => {
      const live = map.get(id);
      return live || { id, name: r.name || "（OneDrive上で見つかりません）", path: r.path || "", isMissing: true };
    })
    .sort((a,b) => a.path.localeCompare(b.path, "ja"));
}
function renderMoreFiles() {
  const list = $("file-list");
  const start = state.rendered;
  const end = Math.min(start + CONFIG.RENDER_BATCH, state.filtered.length);
  const fragment = document.createDocumentFragment();
  for (let i = start; i < end; i++) {
    const file = state.filtered[i];
    const row = document.createElement("div");
    row.dataset.fileId = file.id;
    row.className = "file-row flex items-start gap-1 p-2 rounded-lg border border-transparent hover:bg-slate-50";
    if (state.currentFile?.id === file.id) row.classList.add("active");
    const open = document.createElement("button");
    open.type = "button";
    open.className = "min-w-0 flex-1 text-left";
    const name = document.createElement("div");
    name.className = "font-medium text-slate-700 text-xs break-words";
    name.textContent = file.name;
    const path = document.createElement("div");
    path.className = "text-[10px] text-slate-400 break-all mt-1";
    path.textContent = file.path;
    open.append(name, path);
    open.addEventListener("click", () => { if (!file.isMissing) openFile(file); });
    row.appendChild(open);
    const action = document.createElement("button");
    action.type = "button";
    action.className = "shrink-0 text-[10px] rounded border px-2 py-1 " + (state.listMode === "search" ? "text-blue-700 border-blue-200 hover:bg-blue-50" : "text-slate-500 border-slate-200 hover:bg-slate-100");
    const registered = !!state.progress.__registrations?.[file.id]?.enabled;
    action.textContent = state.listMode === "search" ? (registered ? "登録済み" : "登録") : "解除";
    action.disabled = state.listMode === "search" && registered;
    action.addEventListener("click", () => saveRegistration(file, state.listMode === "search"));
    row.appendChild(action);
    fragment.appendChild(row);
  }
  list.appendChild(fragment);
  state.rendered = end;
  $("more-btn").classList.toggle("hidden", state.rendered >= state.filtered.length);
  if (!state.filtered.length) {
    list.innerHTML = `<div class="text-center text-slate-400 text-xs py-8">${state.listMode === "search" ? "該当するMarkdownファイルがありません。" : "登録済みファイルはありません。「OneDriveから追加」から登録してください。"}</div>`;
  }
}

/* =========================
   Markdown本文の取得・表示
   ========================= */
async function downloadDriveItem(fileId, signal) {
  if (!fileId) throw new Error("ファイルIDが空です。OneDrive一覧を再同期してください。");
  // /content はGraphの認証付きエンドポイント。302リダイレクト先をfetchが追跡するため、downloadUrl属性に依存しない。
  return graphRequest(`/me/drive/items/${encodeURIComponent(fileId)}/content`, { signal });
}
async function openFile(file) {
  const requestId = ++state.openRequest;
  if (state.openController) state.openController.abort();
  state.openController = new AbortController();

  state.currentFile = file;
  document.querySelectorAll(".file-row").forEach(el => el.classList.remove("active"));
  // 現在の項目を見た目上選択
  const selected = [...document.querySelectorAll(".file-row")].find(el => el.firstChild?.textContent === file.name);
  if (selected) selected.classList.add("active");

  $("viewer-header").classList.remove("hidden");
  $("current-file-name").textContent = file.name;
  $("current-file-path").textContent = file.path;
  $("markdown-viewer").innerHTML = '<div class="text-center py-12 text-slate-400"><span class="spinner"></span><p class="mt-3 text-sm">読み込み中…</p></div>';
  setProgressStatus("閲覧位置を確認中…");

  try {
    if (!file.id) throw new Error("ファイルIDがありません。OneDrive一覧を再同期してください。");
    const response = await downloadDriveItem(file.id, state.openController.signal);
    if (!response.ok) throw new Error("本文のダウンロードに失敗しました（" + response.status + "）。");
    const markdown = await response.text();
    if (requestId !== state.openRequest) return;

    const rawHtml = marked.parse(markdown, { gfm: true, breaks: false });
    const cleanHtml = DOMPurify.sanitize(rawHtml, {
      USE_PROFILES: { html: true },
      ADD_ATTR: ["target", "rel"]
    });
    $("markdown-viewer").innerHTML = cleanHtml;

    const saved = state.progress[file.id];
    $("markdown-viewer").scrollTop = saved?.scrollTop || 0;
    setProgressStatus(saved ? "閲覧位置を復元しました" : "新規ファイル");
    $("markdown-viewer").onscroll = () => scheduleProgressSave(file.id);
    document.querySelectorAll(".file-row").forEach(el => el.classList.toggle("active", el.dataset.fileId === file.id));
  } catch (err) {
    if (err.name === "AbortError") return;
    console.error(err);
    $("markdown-viewer").textContent = "本文の読み込みに失敗しました：" + errorMessage(err);
    setProgressStatus("読み込み失敗");
  }
}

/* =========================
   閲覧位置の同期
   OneDrive上のJSONを端末間で共有
   ========================= */
function mergeProgress(a, b) {
  const merged = { version: 2, items: {}, __registrations: {} };
  const allIds = new Set([...Object.keys(a?.items || {}), ...Object.keys(b?.items || {})]);
  for (const id of allIds) {
    const av = a?.items?.[id], bv = b?.items?.[id];
    if (!av) merged.items[id] = bv;
    else if (!bv) merged.items[id] = av;
    else merged.items[id] = (new Date(av.updatedAt || 0) >= new Date(bv.updatedAt || 0)) ? av : bv;
  }
  const regIds = new Set([...Object.keys(a?.__registrations || {}), ...Object.keys(b?.__registrations || {})]);
  for (const id of regIds) {
    const av = a?.__registrations?.[id], bv = b?.__registrations?.[id];
    if (!av) merged.__registrations[id] = bv;
    else if (!bv) merged.__registrations[id] = av;
    else merged.__registrations[id] = (new Date(av.updatedAt || 0) >= new Date(bv.updatedAt || 0)) ? av : bv;
  }
  return merged;
}
async function downloadProgressFile() {
  try {
    const response = await graphRequest(`/me/drive/root:/${encodeURIComponent(CONFIG.PROGRESS_FILE)}:/content`);
    const text = await response.text();
    const data = JSON.parse(text || "{}");
    return data && typeof data === "object" ? data : { version: 2, items: {}, __registrations: {} };
  } catch (err) {
    if (/Graph APIエラー 404/.test(errorMessage(err))) return { version: 2, items: {}, __registrations: {} };
    throw err;
  }
}
async function uploadProgressFile(data) {
  const body = JSON.stringify(data);
  const response = await graphRequest(`/me/drive/root:/${encodeURIComponent(CONFIG.PROGRESS_FILE)}:/content`, {
    method: "PUT",
    headers: { "Content-Type": "text/plain; charset=utf-8" },
    body
  });
  // /content PUTは通常DriveItemを返すが、空レスポンスでも保存処理自体は成功扱いにする。
  if (response.status !== 204) await response.json().catch(() => null);
}
function scheduleProgressSave(fileId) {
  if (!fileId) return;
  clearTimeout(state.saveTimer);
  setProgressStatus("未保存の変更あり");
  state.saveTimer = setTimeout(() => {
    const scrollTop = $("markdown-viewer").scrollTop;
    state.progress[fileId] = { scrollTop, updatedAt: new Date().toISOString() };
    localStorage.setItem("md_reader_progress_backup", JSON.stringify(state.progress));
    queueProgressSave();
  }, CONFIG.SAVE_DELAY);
}
function queueProgressSave() {
  state.saveChain = state.saveChain.then(async () => {
    if (!state.account) return;
    setProgressStatus("同期中…");
    try {
      // 他端末で更新された履歴を先に取得してマージする
      const remote = await downloadProgressFile();
      const localItems = Object.fromEntries(Object.entries(state.progress).filter(([key]) => key !== "__registrations"));
      const local = { version: 2, items: localItems, __registrations: state.progress.__registrations || {} };
      const merged = mergeProgress(remote, local);
      await uploadProgressFile(merged);
      state.progress = { ...merged.items, __registrations: merged.__registrations };
      localStorage.setItem("md_reader_progress_backup", JSON.stringify(state.progress));
      refreshRegisteredFiles();
      applyFilter();
      setProgressStatus("同期済み");
    } catch (err) {
      console.error(err);
      setProgressStatus("同期失敗（ローカル保存済み）");
      showToast("閲覧位置のOneDrive同期に失敗しました。再接続後に再保存してください。", 6000);
    }
  }).catch(err => console.error("保存キューエラー", err));
  return state.saveChain;
}
async function loadProgress() {
  const backup = (() => {
    try { return JSON.parse(localStorage.getItem("md_reader_progress_backup") || "{}"); }
    catch (_) { return {}; }
  })();
  const backupDoc = { version: 2, items: Object.fromEntries(Object.entries(backup).filter(([k]) => k !== "__registrations")), __registrations: backup.__registrations || {} };
  const remote = await downloadProgressFile();
  const merged = mergeProgress(remote, backupDoc);
  state.progress = { ...merged.items, __registrations: merged.__registrations };
  localStorage.setItem("md_reader_progress_backup", JSON.stringify(state.progress));
}
/* =========================
   アプリ起動
   ========================= */
async function startApp() {
  $("sync-btn").disabled = false;
  $("filter-input").disabled = false;
  await loadProgress();
  await loadFileIndex();
  const cachedCount = state.files.length;

  if (cachedCount) {
    setListStatus(`保存済み一覧を表示中（${cachedCount.toLocaleString("ja-JP")} 件）。差分を確認します。`);
  } else {
    setListStatus("初回同期を開始します。ファイル数によって時間がかかります。");
  }
  await syncDrive();
}
async function flushProgress() {
  clearTimeout(state.saveTimer);
  if (state.currentFile) {
    state.progress[state.currentFile.id] = {
      scrollTop: $("markdown-viewer").scrollTop,
      updatedAt: new Date().toISOString()
    };
    localStorage.setItem("md_reader_progress_backup", JSON.stringify(state.progress));
    await queueProgressSave();
  }
}

/* =========================
   イベント
   ========================= */
$("login-btn").addEventListener("click", login);
$("logout-btn").addEventListener("click", logout);
$("sync-btn").addEventListener("click", syncDrive);
$("filter-input").addEventListener("input", applyFilter);
$("more-btn").addEventListener("click", renderMoreFiles);
$("show-registered-btn").addEventListener("click", () => setListMode("registered"));
$("show-search-btn").addEventListener("click", () => setListMode("search"));
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushProgress();
});
window.addEventListener("beforeunload", () => {
  if (state.currentFile) {
    state.progress[state.currentFile.id] = {
      scrollTop: $("markdown-viewer").scrollTop,
      updatedAt: new Date().toISOString()
    };
    try { localStorage.setItem("md_reader_progress_backup", JSON.stringify(state.progress)); } catch (_) {}
  }
});

(async function boot() {
  try {
    state.db = await openDatabase();
    await initAuth();
  } catch (err) {
    console.error(err);
    setListStatus("初期化エラー：" + errorMessage(err));
    showToast("初期化に失敗しました：" + errorMessage(err), 8000);
  }
})();
})();
</script>
