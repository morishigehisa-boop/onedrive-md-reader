<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneDrive Markdown Reader</title>
    <!-- Tailwind CSS for Responsive UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
    <!-- Microsoft Graph SDK (Browser Auth via jsDelivr) -->
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold text-slate-700">📖 OneDrive Markdown Reader</h1>
            <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2 py-0.5 rounded-full border border-emerald-300">v1.1.1</span>
        </div>
        <div id="auth-section">
            <button id="login-btn" onclick="triggerLogin()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer">
                Microsoft ログイン
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-4 gap-6">
        
        <!-- Sidebar: File List & Search Settings -->
        <aside class="md:col-span-1 bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col h-[70vh] md:h-[calc(100vh-8rem)]">
            <div class="mb-3">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">検索対象フォルダ</h2>
                <div class="flex gap-2">
                    <input id="target-folder" type="text" placeholder="例: Documents/デスクトップ/yt分析/channels" class="flex-1 border border-slate-300 rounded px-2 py-1 text-xs focus:outline-none focus:border-blue-500">
                    <button onclick="triggerFolderUpdate()" class="bg-slate-700 hover:bg-slate-800 text-white px-2 py-1 rounded text-xs transition cursor-pointer">更新</button>
                </div>
                <p class="text-[10px] text-slate-400 mt-1">※空欄でルート全体。サブフォルダ内も再帰検索します。</p>
            </div>

            <hr class="border-slate-100 my-2">

            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Markdown 一覧</h2>
                <span id="file-count" class="text-xs text-slate-400">0 件</span>
            </div>

            <div id="file-list" class="overflow-y-auto flex-1 space-y-1.5 text-sm">
                <p class="text-slate-400 text-center py-8 text-xs">ログインしてファイルを読み込んでください。</p>
            </div>
        </aside>

        <!-- Content Area: Markdown Viewer -->
        <section class="md:col-span-3 bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col h-[75vh] md:h-[calc(100vh-8rem)]">
            <div id="viewer-header" class="border-b pb-3 mb-4 flex justify-between items-center hidden">
                <div>
                    <span id="current-file-name" class="font-bold text-slate-700 text-base">ファイル未選択</span>
                    <span id="current-file-path" class="block text-xs text-slate-400 mt-0.5"></span>
                </div>
                <span id="sync-status" class="text-xs text-slate-400 bg-slate-100 px-2 py-1 rounded">同期済み</span>
            </div>
            <div id="markdown-viewer" class="overflow-y-auto flex-1 prose max-w-none text-slate-700 leading-relaxed pr-2">
                <div class="text-center py-20 text-slate-400">
                    <p class="text-lg mb-2">左側のリストからMarkdownファイルを選択してください。</p>
                    <p class="text-xs">どの端末から読んでも、前回のスクロール位置が自動で同期されます。</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Script Logic -->
    <script>
        const CLIENT_ID = "3c6cf6bf-6af7-4bd0-ad41-cca85929f8b6";
        
        const msalConfig = {
            auth: {
                clientId: CLIENT_ID,
                redirectUri: window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/'),
            }
        };

        let msalInstance = null;
        let accessToken = null;
        let currentFileId = null;
        let readingProgress = {};

        // ボタンから直接呼び出せる関数
        window.triggerLogin = async function() {
            console.log("ログインボタンが押下されました。");
            if (!msalInstance) {
                alert("認証ライブラリが初期化中です。数秒待ってから再度クリックしてください。");
                return;
            }
            try {
                console.log("リダイレクト処理を開始します...");
                await msalInstance.loginRedirect({
                    scopes: ["User.Read", "Files.ReadWrite"]
                });
            } catch (err) {
                console.error("ログイン実行エラー:", err);
                alert("ログイン処理に失敗しました。詳細はコンソールをご確認ください。");
            }
        };

        window.triggerFolderUpdate = function() {
            const folderInputEl = document.getElementById('target-folder');
            if (folderInputEl) {
                const val = folderInputEl.value.trim();
                localStorage.setItem('md_reader_target_folder', val);
            }
            if (accessToken) {
                loadFilesAndProgress();
            } else {
                alert("先にMicrosoftログインを行ってください。");
            }
        };

        async function initMsal() {
            try {
                if (typeof msal === 'undefined') {
                    throw new Error("MSALライブラリがロードされていません。");
                }
                msalInstance = new msal.PublicClientApplication(msalConfig);
                await msalInstance.initialize();

                const response = await msalInstance.handleRedirectPromise();
                if (response) {
                    accessToken = response.accessToken;
                    onLoginSuccess();
                } else {
                    const accounts = msalInstance.getAllAccounts();
                    if (accounts.length > 0) {
                        try {
                            const silentRes = await msalInstance.acquireTokenSilent({
                                scopes: ["User.Read", "Files.ReadWrite"],
                                account: accounts[0]
                            });
                            accessToken = silentRes.accessToken;
                            onLoginSuccess();
                        } catch (silentErr) {
                            console.warn("サイレントトークン取得失敗 (再ログインが必要):", silentErr);
                        }
                    }
                }
                console.log("MSAL Initialized successfully.");
            } catch (err) {
                console.error("MSAL Initialization Error:", err);
            }
        }

        function onLoginSuccess() {
            const authSec = document.getElementById('auth-section');
            if (authSec) {
                authSec.innerHTML = `<span class="text-sm text-green-600 font-medium">ログイン中</span>`;
            }
            loadFilesAndProgress();
        }

        async function callGraphAPI(endpoint, method = "GET", body = null) {
            const headers = new Headers();
            headers.append("Authorization", `Bearer ${accessToken}`);
            if (body) headers.append("Content-Type", "application/json");

            const options = { method, headers };
            if (body) options.body = JSON.stringify(body);

            const response = await fetch(`https://graph.microsoft.com/v1.0${endpoint}`, options);
            if (!response.ok && response.status !== 404) throw new Error("Graph API Error");
            return response.status === 404 ? null : await response.json();
        }

        async function fetchMdFilesRecursively(folderEndpoint, currentPath = "") {
            let mdList = [];
            let nextLink = folderEndpoint;

            while (nextLink) {
                const res = await callGraphAPI(nextLink);
                if (!res || !res.value) break;

                for (const item of res.value) {
                    if (item.folder) {
                        const subPath = currentPath ? `${currentPath}/${item.name}` : item.name;
                        const subFiles = await fetchMdFilesRecursively(`/me/drive/items/${item.id}/children`, subPath);
                        mdList = mdList.concat(subFiles);
                    } else if (item.name && item.name.toLowerCase().endsWith('.md')) {
                        mdList.push({
                            id: item.id,
                            name: item.name,
                            path: currentPath ? `${currentPath}/${item.name}` : item.name
                        });
                    }
                }
                nextLink = res['@odata.nextLink'] ? res['@odata.nextLink'].replace("https://graph.microsoft.com/v1.0", "") : null;
            }
            return mdList;
        }

        async function loadFilesAndProgress() {
            const fileListEl = document.getElementById('file-list');
            const fileCountEl = document.getElementById('file-count');
            fileListEl.innerHTML = `<p class="text-slate-400 text-center py-6 text-xs">検索中...</p>`;

            try {
                const progressRes = await callGraphAPI("/me/drive/root:/reading-progress.json:/content");
                readingProgress = progressRes || {};

                const folderInputEl = document.getElementById('target-folder');
                let folderInput = folderInputEl ? folderInputEl.value.trim().replace(/^\/+|\/+$/g, '') : "";
                
                let startEndpoint = "/me/drive/root/children";
                if (folderInput) {
                    const encodedParts = folderInput.split('/').map(p => encodeURIComponent(p)).join('/');
                    startEndpoint = `/me/drive/root:/${encodedParts}:/children`;
                }

                const mdFiles = await fetchMdFilesRecursively(startEndpoint, folderInput);
                fileCountEl.textContent = `${mdFiles.length} 件`;
                fileListEl.innerHTML = "";

                if (mdFiles.length === 0) {
                    fileListEl.innerHTML = `<p class="text-slate-400 text-center py-6 text-xs">対象フォルダ内に .md ファイルが見つかりませんでした。</p>`;
                    return;
                }

                mdFiles.sort((a, b) => a.name.localeCompare(b.name));

                mdFiles.forEach(file => {
                    const itemBtn = document.createElement('div');
                    itemBtn.className = "p-2 rounded-lg hover:bg-slate-100 cursor-pointer transition border border-transparent hover:border-slate-200";
                    itemBtn.innerHTML = `
                        <div class="font-medium text-slate-700 truncate text-xs">${file.name}</div>
                        <div class="text-[10px] text-slate-400 truncate mt-0.5">${file.path}</div>
                    `;
                    itemBtn.onclick = () => openFile(file.id, file.name, file.path);
                    fileListEl.appendChild(itemBtn);
                });
            } catch (err) {
                console.error(err);
                fileListEl.innerHTML = `<p class="text-red-500 text-center py-6 text-xs">取得に失敗しました。フォルダのパスをご確認ください。</p>`;
            }
        }

        async function openFile(fileId, fileName, filePath) {
            currentFileId = fileId;
            document.getElementById('viewer-header').classList.remove('hidden');
            document.getElementById('current-file-name').textContent = fileName;
            document.getElementById('current-file-path').textContent = filePath;
            
            const viewer = document.getElementById('markdown-viewer');
            viewer.innerHTML = `<p class="text-center py-10 text-slate-400 text-sm">読み込み中...</p>`;

            try {
                const contentRes = await fetch(`https://graph.microsoft.com/v1.0/me/drive/items/${fileId}/content`, {
                    headers: { "Authorization": `Bearer ${accessToken}` }
                });
                const markdownText = await contentRes.text();
                viewer.innerHTML = marked.parse(markdownText);

                if (readingProgress[fileId]) {
                    viewer.scrollTop = readingProgress[fileId];
                }

                viewer.onscroll = () => {
                    clearTimeout(window.saveTimeout);
                    window.saveTimeout = setTimeout(() => saveProgress(fileId, viewer.scrollTop), 1000);
                };
            } catch (err) {
                console.error(err);
                viewer.innerHTML = `<p class="text-red-500 text-sm">ファイルの読み込みに失敗しました。</p>`;
            }
        }

        async function saveProgress(fileId, scrollTop) {
            readingProgress[fileId] = scrollTop;
            document.getElementById('sync-status').textContent = "同期中...";
            try {
                await callGraphAPI(`/me/drive/root:/reading-progress.json:/content`, "PUT", readingProgress);
                document.getElementById('sync-status').textContent = "同期済み";
            } catch (err) {
                console.error(err);
                document.getElementById('sync-status').textContent = "同期失敗";
            }
        }

        // 初期化処理の開始
        document.addEventListener('DOMContentLoaded', () => {
            const folderInputEl = document.getElementById('target-folder');
            if (folderInputEl) {
                folderInputEl.value = localStorage.getItem('md_reader_target_folder') || "Documents/デスクトップ/yt分析/channels";
            }
            initMsal();
        });
    </script>
</body>
</html>
