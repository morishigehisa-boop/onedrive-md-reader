<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneDrive Markdown Reader</title>
    <!-- Tailwind CSS for Responsive UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
    <!-- Microsoft Graph SDK (Browser Auth via jsDelivr) -->
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center shadow-sm">
        <h1 class="text-lg font-bold text-slate-700">📖 OneDrive Markdown Reader</h1>
        <div id="auth-section">
            <button id="login-btn" onclick="window.login()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                Microsoft ログイン
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-4 gap-6">
        
        <!-- Sidebar: File List & Search Settings -->
        <aside class="md:col-span-1 bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col h-[70vh] md:h-[calc(100vh-8rem)]">
            <div class="mb-3">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">検索対象フォルダ</h2>
                <div class="flex gap-2">
                    <input id="target-folder" type="text" placeholder="例: Documents や フォルダ名" class="flex-1 border border-slate-300 rounded px-2 py-1 text-xs focus:outline-none focus:border-blue-500">
                    <button onclick="changeFolderAndReload()" class="bg-slate-700 hover:bg-slate-800 text-white px-2 py-1 rounded text-xs transition">更新</button>
                </div>
                <p class="text-[10px] text-slate-400 mt-1">※空欄でルート全体。サブフォルダ内も再帰検索します。</p>
            </div>

            <hr class="border-slate-100 my-2">

            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Markdown 一覧</h2>
                <span id="file-count" class="text-xs text-slate-400">0 件</span>
            </div>

            <div id="file-list" class="overflow-y-auto flex-1 space-y-1.5 text-sm">
                <p class="text-slate-400 text-center py-8 text-xs">ログインしてファイルを読み込んでください。</p>
            </div>
        </aside>

        <!-- Content Area: Markdown Viewer -->
        <section class="md:col-span-3 bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col h-[75vh] md:h-[calc(100vh-8rem)]">
            <div id="viewer-header" class="border-b pb-3 mb-4 flex justify-between items-center hidden">
                <div>
                    <span id="current-file-name" class="font-
