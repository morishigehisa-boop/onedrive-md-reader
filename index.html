<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneDrive Markdown Reader</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <!-- MSAL -->
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
    
    <style>
        #markdown-viewer { font-size: 0.95rem; line-height: 1.8; color: #334155; }
        #markdown-viewer h1, #markdown-viewer h2, #markdown-viewer h3, #markdown-viewer h4 { color: #0f172a; font-weight: 700; margin-top: 1.8em; margin-bottom: 0.8em; }
        #markdown-viewer h1 { font-size: 1.5rem; border-bottom: 2px solid #94a3b8; padding-bottom: 0.4em; }
        #markdown-viewer h2 { font-size: 1.25rem; border-bottom: 1px solid #cbd5e1; padding-bottom: 0.3em; }
        #markdown-viewer h3 { font-size: 1.1rem; border-left: 4px solid #3b82f6; padding-left: 0.6em; }
        #markdown-viewer strong { color: #0369a1; background-color: #f0f9ff; padding: 2px 4px; border-radius: 4px; font-weight: 700; }
        #markdown-viewer ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        #markdown-viewer ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
        #markdown-viewer li { margin-bottom: 0.4em; }
        #markdown-viewer p { margin-bottom: 1em; }
        #markdown-viewer hr { border-color: #e2e8f0; margin: 2em 0; border-style: solid; }
        #markdown-viewer blockquote { border-left: 4px solid #cbd5e1; color: #64748b; margin: 1em 0; background-color: #f8fafc; padding: 0.5em 1em; border-radius: 0 4px 4px 0; }
        #markdown-viewer code { background-color: #f1f5f9; color: #be123c; padding: 0.2em 0.4em; border-radius: 0.25rem; font-family: monospace; font-size: 0.9em; }
        #markdown-viewer pre { background-color: #1e293b; color: #f8fafc; padding: 1em; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1em; }
        #markdown-viewer pre code { background-color: transparent; color: inherit; padding: 0; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold text-slate-700">📖 OneDrive Markdown Reader</h1>
            <!-- ブラックバッジ -->
            <span class="bg-slate-800 text-white text-xs font-semibold px-2.5 py-0.5 rounded-full">v2.8.0</span>
        </div>
        <div id="auth-section">
            <button id="login-btn" type="button" onclick="window.startLogin()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer">
                Microsoft ログイン
            </button>
        </div>
    </header>

    <main class="flex-1 w-full px-2 py-4 md:px-4 md:py-6 flex flex-col md:flex-row gap-4 md:gap-6 items-stretch">
        
        <aside style="resize: horizontal;" class="overflow-hidden w-full md:w-80 md:min-w-[16rem] flex-shrink-0 bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col h-[70vh] md:h-[calc(100vh-8rem)] relative">
            <div class="mb-3">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">ファイル名検索</h2>
                <div class="flex gap-2">
                    <input id="target-filter" type="text" placeholder="例: bukken_notes.md" class="flex-1 border border-slate-300 rounded px-2 py-1 text-xs focus:outline-none focus:border-slate-800">
                    <button id="search-btn" type="button" onclick="window.startSearch()" class="bg-slate-800 hover:bg-slate-900 text-white px-2.5 py-1 rounded text-xs transition cursor-pointer">検索</button>
                </div>
            </div>
            <hr class="border-slate-100 my-2">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Markdown 一覧</h2>
                <span id="file-count" class="text-xs text-slate-400">0 件</span>
            </div>
            <div id="file-list" class="overflow-y-auto flex-1 space-y-1.5 text-sm pb-4">
                <p class="text-slate-400 text-center py-8 text-xs">ログインしてファイルを読み込んでください。</p>
            </div>
        </aside>

        <section style="resize: horizontal;" class="overflow-hidden flex-1 min-w-[300px] bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col h-[75vh] md:h-[calc(100vh-8rem)] relative">
            <div id="viewer-header" class="border-b pb-3 mb-4 flex justify-between items-center hidden">
                <div class="min-w-0 flex-1 pr-4">
                    <span id="current-file-name" class="font-bold text-slate-700 text-base truncate block">ファイル未選択</span>
                    <span id="current-file-path" class="text-xs text-slate-400 mt-0.5 truncate block"></span>
                </div>
                <span id="sync-status" class="text-xs text-slate-400 bg-slate-100 px-2 py-1 rounded flex-shrink-0">同期済み</span>
            </div>
            <div id="markdown-viewer" class="overflow-y-auto flex-1 pr-2">
                <div class="text-center py-20 text-slate-400">
                    <p class="text-lg mb-2">左側のリストからファイルを選択してください。</p>
                </div>
            </div>
        </section>
    </main>

    <!-- 【スクリプトブロック1: 関数の定義のみ】ここでエラーが起きることは絶対にありません -->
    <script>
        window.myMsal = null;
        window.myAccessToken = null;
        window.readingProgress = {};
        window.scrollTimeout = null;

        window.startLogin = function() {
            // ★ボタンが押された証拠のアラートを必ず出します
            alert("ログイン処理を開始します。");
            if (!window.myMsal) {
                alert("MSAL(認証ライブラリ)がまだ読み込まれていません。ページを更新してください。");
                return;
            }
            window.myMsal.loginRedirect({ scopes: ["User.Read", "Files.ReadWrite"] })
                .catch(function(err) {
                    alert("ログインエラー: " + err.message);
                });
        };

        window.startSearch = function() {
            const filterInputEl = document.getElementById('target-filter');
            if (filterInputEl) localStorage.setItem('md_reader_filter', filterInputEl.value.trim());
            if (window.myAccessToken) {
                window.loadFilesAndProgress();
            } else {
                alert("先にMicrosoftログインを行ってください。");
            }
        };

        window.callGraphAPI = async function(endpoint, method = "GET", body = null) {
            const headers = new Headers();
            headers.append("Authorization", `Bearer ${window.myAccessToken}`);
            if (body) headers.append("Content-Type", "application/json");
            const options = { method, headers };
            if (body) options.body = JSON.stringify(body);
            const response = await fetch(`https://graph.microsoft.com/v1.0${endpoint}`, options);
            if (!response.ok && response.status !== 404) throw new Error(`Graph API Error: ${response.status}`);
            return response.status === 404 ? null : await response.json();
        };

        window.loadFilesAndProgress = async function() {
            const fileListEl = document.getElementById('file-list');
            const fileCountEl = document.getElementById('file-count');
            fileListEl.innerHTML = `<p class="text-slate-400 text-center py-6 text-xs">スキャン中...<br>数秒かかります。</p>`;

            try {
                const progressRes = await window.callGraphAPI("/me/drive/root:/reading-progress.json:/content");
                window.readingProgress = progressRes || {};
                const filterWord = (document.getElementById('target-filter').value || "").trim().toLowerCase();
                
                let mdFiles = [];
                let nextLink = "/me/drive/root/search(q='.md')?$top=200";
                
                while (nextLink) {
                    let searchRes;
                    if (nextLink.startsWith('http')) {
                        const response = await fetch(nextLink, { headers: { "Authorization": `Bearer ${window.myAccessToken}` } });
                        if (!response.ok) break;
                        searchRes = await response.json();
                    } else {
                        searchRes = await window.callGraphAPI(nextLink);
                    }
                    if (searchRes && searchRes.value) {
                        const chunk = searchRes.value.filter(f => f.file && f.name.toLowerCase().endsWith('.md')).map(f => {
                            let relPath = f.name;
                            if (f.parentReference && f.parentReference.path) {
                                relPath = decodeURIComponent(f.parentReference.path.replace(/^\/drive\/root:/, '')) + '/' + f.name;
                                relPath = relPath.replace(/^\/+/, '');
                            }
                            return { id: f.id, name: f.name, path: relPath };
                        });
                        mdFiles = mdFiles.concat(chunk);
                        nextLink = searchRes['@odata.nextLink'] || null;
                    } else break;
                }

                if (filterWord) mdFiles = mdFiles.filter(f => f.path.toLowerCase().includes(filterWord) || f.name.toLowerCase().includes(filterWord));
                fileCountEl.textContent = `${mdFiles.length} 件`;
                fileListEl.innerHTML = "";

                if (mdFiles.length === 0) {
                    fileListEl.innerHTML = `<div class="text-center py-6 px-2 text-xs text-slate-400"><p>見つかりませんでした</p></div>`;
                    return;
                }

                mdFiles.sort((a, b) => a.name.localeCompare(b.name));
                mdFiles.forEach(file => {
                    const itemBtn = document.createElement('div');
                    itemBtn.className = "p-2 rounded-lg hover:bg-slate-100 cursor-pointer transition border border-transparent hover:border-slate-200";
                    itemBtn.innerHTML = `<div class="font-medium text-slate-700 truncate text-xs">${file.name}</div><div class="text-[10px] text-slate-400 truncate mt-0.5" title="${file.path}">${file.path}</div>`;
                    itemBtn.onclick = () => window.openFile(file.id, file.name, file.path);
                    fileListEl.appendChild(itemBtn);
                });

                if (mdFiles.length === 1) window.openFile(mdFiles[0].id, mdFiles[0].name, mdFiles[0].path);

            } catch (err) {
                console.error(err);
                fileListEl.innerHTML = `<p class="text-red-500 text-center py-6 text-xs">取得に失敗しました。</p>`;
            }
        };

        window.openFile = async function(fileId, fileName, filePath) {
            document.getElementById('viewer-header').classList.remove('hidden');
            document.getElementById('current-file-name').textContent = fileName;
            document.getElementById('current-file-path').textContent = filePath;
            const viewer = document.getElementById('markdown-viewer');
            viewer.innerHTML = `<p class="text-center py-10 text-slate-400 text-sm">読み込み中...</p>`;

            try {
                const itemMeta = await window.callGraphAPI(`/me/drive/items/${fileId}`);
                const downloadUrl = itemMeta['@microsoft.graph.downloadUrl'];
                if (!downloadUrl) throw new Error("URL取得失敗");

                const contentRes = await fetch(downloadUrl);
                if (!contentRes.ok) throw new Error("本文取得失敗");
                
                const markdownText = await contentRes.text();
                viewer.innerHTML = marked.parse(markdownText);

                if (window.readingProgress[fileId]) viewer.scrollTop = window.readingProgress[fileId];
                viewer.onscroll = () => {
                    clearTimeout(window.scrollTimeout);
                    window.scrollTimeout = setTimeout(() => window.saveProgress(fileId, viewer.scrollTop), 1000);
                };
            } catch (err) {
                viewer.innerHTML = `<p class="text-center text-red-500 text-sm mt-10">読み込みに失敗しました。</p>`;
            }
        };

        window.saveProgress = async function(fileId, scrollTop) {
            window.readingProgress[fileId] = scrollTop;
            document.getElementById('sync-status').textContent = "同期中...";
            try {
                await window.callGraphAPI(`/me/drive/root:/reading-progress.json:/content`, "PUT", window.readingProgress);
                document.getElementById('sync-status').textContent = "同期済み";
            } catch (err) {
                document.getElementById('sync-status').textContent = "同期失敗";
            }
        };
    </script>

    <!-- 【スクリプトブロック2: 実行処理】 -->
    <script>
        (async function initApp() {
            try {
                const inputEl = document.getElementById('target-filter');
                if (inputEl) inputEl.value = localStorage.getItem('md_reader_filter') || "";

                if (typeof msal === 'undefined') {
                    console.error("MSAL is undefined.");
                    return;
                }

                const CLIENT_ID = "3c6cf6bf-6af7-4bd0-ad41-cca85929f8b6";
                const redirectUri = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/');
                window.myMsal = new msal.PublicClientApplication({ auth: { clientId: CLIENT_ID, redirectUri: redirectUri } });
                await window.myMsal.initialize();

                const response = await window.myMsal.handleRedirectPromise();
                if (response) {
                    window.myAccessToken = response.accessToken;
                    document.getElementById('auth-section').innerHTML = `<span class="text-sm text-green-600 font-medium">ログイン中</span>`;
                    window.loadFilesAndProgress();
                } else {
                    const accounts = window.myMsal.getAllAccounts();
                    if (accounts.length > 0) {
                        const silentRes = await window.myMsal.acquireTokenSilent({ scopes: ["User.Read", "Files.ReadWrite"], account: accounts[0] });
                        window.myAccessToken = silentRes.accessToken;
                        document.getElementById('auth-section').innerHTML = `<span class="text-sm text-green-600 font-medium">ログイン中</span>`;
                        window.loadFilesAndProgress();
                    }
                }
            } catch (err) {
                console.error("初期化エラー:", err);
            }
        })();
    </script>
</body>
</html>
