        const text=await getFullText(file);
        const lower=text.toLocaleLowerCase();let from=0,count=0;const hits=[];
        while((from=lower.indexOf(q,from))!==-1&&count<5){const start=Math.max(0,from-90),end=Math.min(text.length,from+q.length+110);hits.push({file,excerpt:text.slice(start,end).replace(/\n/g," "),index:from});from+=q.length;count++;}
        resultsByFile[index]=hits;
      }catch(err){console.warn("全文検索スキップ",file.name,err);}
      done++;
      if(token===state.searchToken)box.textContent=`検索中… ${done}/${total}`;
    }
  };
  await Promise.all(Array.from({length:Math.min(CONFIG.SEARCH_CONCURRENCY,total)},worker));
  if(token!==state.searchToken)return; // 新しい検索が始まっていれば結果を捨てる
  const results=resultsByFile.flat().filter(Boolean);
  box.innerHTML="";
  if(!results.length){box.textContent="一致する文章はありませんでした。";return;}
  const title=document.createElement("div");title.className="px-2 py-1 text-slate-500";title.textContent=`${results.length}件見つかりました`;box.appendChild(title);
  results.slice(0,100).forEach(r=>{const b=document.createElement("button");b.type="button";b.className="block w-full text-left p-2 border-t hover:bg-slate-50";const strong=document.createElement("strong");strong.className="block";strong.textContent=r.file.name;const small=document.createElement("span");small.className="block text-slate-500 mt-1";small.textContent=r.excerpt;b.append(strong,small);b.addEventListener("click",async()=>{await openFile(r.file);const needle=normalizeText(r.excerpt.trim()).slice(0,35);const hit=state.blocks.find(b2=>normalizeText(blockText(b2.el)).includes(needle))||state.blocks.find(b2=>normalizeText(blockText(b2.el)).includes(normalizeText(needleRaw)));if(hit){hit.el.scrollIntoView({behavior:"smooth",block:"center"});}showToast(hit?"検索した文章の位置へ移動しました。":"ファイルを開きました。検索語が見つからない場合は本文を確認してください。");});box.appendChild(b);});
}

/* =========================
   タグ・読書キュー・注釈エクスポート
   ========================= */
function saveCurrentFileTags(){
  if(!state.currentFile)return showToast("先にMarkdownファイルを開いてください。");
  const tags=[...new Set($("tag-editor").value.split(/[，,、]/).map(x=>x.trim()).filter(Boolean).map(x=>x.slice(0,40)))].slice(0,20);
  state.progress.__fileTags=state.progress.__fileTags||{};
  state.progress.__fileTags[state.currentFile.id]={tags,updatedAt:new Date().toISOString()};
  state.fileTags=state.progress.__fileTags; markProgressChanged();applyFilter(true);queueProgressSave();
  showToast(tags.length?`タグを${tags.length}件保存しました。`:"タグを削除しました。");
}
function fileById(id){return state.files.find(f=>f.id===id)||state.registeredFiles.find(f=>f.id===id)||null;}
/* 読書キュー：削除は墓標方式、並び順はorderで管理 */
function activeQueue(){
  return (state.progress.__readingQueue||[]).filter(x=>!x.deleted)
    .sort((a,b)=>(Number.isFinite(a.order)?a.order:1e9)-(Number.isFinite(b.order)?b.order:1e9)||new Date(a.updatedAt||0)-new Date(b.updatedAt||0));
}
function addCurrentToQueue(){
  if(!state.currentFile)return showToast("先にMarkdownファイルを開いてください。");
  const q=state.progress.__readingQueue=state.progress.__readingQueue||[];
  const active=activeQueue();
  const existing=q.find(x=>x.fileId===state.currentFile.id);
  if(existing&&!existing.deleted)return showToast("この文書は既に読書キューにあります。");
  const now=new Date().toISOString(), order=active.length;
  if(existing){existing.deleted=false;existing.order=order;existing.name=state.currentFile.name;existing.path=state.currentFile.path;existing.updatedAt=now;}
  else q.push({fileId:state.currentFile.id,name:state.currentFile.name,path:state.currentFile.path,order,updatedAt:now});
  state.readingQueue=q;markProgressChanged();queueProgressSave();renderQueuePanel();showToast("読書キューに追加しました。");
}
function removeQueueItem(fileId){
  const item=(state.progress.__readingQueue||[]).find(x=>x.fileId===fileId); if(!item)return;
  item.deleted=true; item.updatedAt=new Date().toISOString();
  state.readingQueue=state.progress.__readingQueue;markProgressChanged();queueProgressSave();renderQueuePanel();
}
function moveQueueItem(fileId,direction){
  const list=activeQueue(), idx=list.findIndex(x=>x.fileId===fileId), j=idx+direction;
  if(idx<0||j<0||j>=list.length)return;
  const now=new Date().toISOString();
  list.forEach((q,i)=>{if(q.order!==i){q.order=i;q.updatedAt=now;}}); // 並び順を連番に整える
  const a=list[idx], b=list[j];
  [a.order,b.order]=[b.order,a.order]; a.updatedAt=now; b.updatedAt=now;
  markProgressChanged();queueProgressSave();renderQueuePanel();
}
function renderQueuePanel(){
  const panel=$("queue-panel");panel.innerHTML="";
  const queue=activeQueue();
  const heading=document.createElement("div");heading.className="font-semibold mb-1";heading.textContent=`次に読む（${queue.length}件）`;panel.appendChild(heading);
  if(!queue.length){const empty=document.createElement("div");empty.className="text-slate-500 py-1";empty.textContent="読書キューは空です。本文画面から追加できます。";panel.appendChild(empty);}
  queue.forEach((item,i)=>{
    const row=document.createElement("div");row.className="flex items-center gap-1 border-t py-1";
    const open=document.createElement("button");open.type="button";open.className="text-left flex-1 truncate hover:underline";open.textContent=item.name||fileById(item.fileId)?.name||item.fileId;
    open.addEventListener("click",async()=>{const f=fileById(item.fileId);if(f)await openFile(f);else showToast("このファイルは一覧に見つかりません。OneDriveを同期してください。");});
    const mkBtn=(label,title,handler,disabled)=>{const b=document.createElement("button");b.type="button";b.textContent=label;b.title=title;b.className="border rounded px-2 py-1 text-slate-600 disabled:opacity-30";b.disabled=!!disabled;b.addEventListener("click",handler);return b;};
    row.append(open,
      mkBtn("↑","上へ",()=>moveQueueItem(item.fileId,-1),i===0),
      mkBtn("↓","下へ",()=>moveQueueItem(item.fileId,1),i===queue.length-1),
      mkBtn("削除","キューから外す",()=>removeQueueItem(item.fileId)));
    panel.appendChild(row);
  });
  const recent=Object.entries(state.progress).filter(([k,v])=>!k.startsWith("__")&&v&&v.updatedAt).sort((a,b)=>new Date(b[1].updatedAt)-new Date(a[1].updatedAt)).slice(0,8);
  const rh=document.createElement("div");rh.className="font-semibold mt-3 mb-1";rh.textContent="最近読んだ文書";panel.appendChild(rh);
  if(!recent.length){const e=document.createElement("div");e.className="text-slate-500";e.textContent="閲覧履歴はありません。";panel.appendChild(e);}
  recent.forEach(([id])=>{const f=fileById(id);if(!f)return;const b=document.createElement("button");b.type="button";b.className="block w-full text-left truncate py-1 hover:underline";b.textContent=f.name;b.addEventListener("click",()=>openFile(f));panel.appendChild(b);});
}
function exportAnnotationsMarkdown(){
  const all=state.progress.__annotations||{};
  const fileIds=Object.keys(all).filter(id=>activeAnnotations(id).length);
  if(!fileIds.length)return showToast("出力する注釈がありません。");
  const lines=["# Markdown Reader - ハイライト・メモ・しおり","",`出力日時：${new Date().toLocaleString("ja-JP")}`];
  for(const id of fileIds){const f=fileById(id);const items=activeAnnotations(id);lines.push("","## "+(f?.name||id),"");for(const item of items){if(item.type==="highlight")lines.push(`> 🖍 ${String(item.quote||"").replace(/\n/g,"\n> ")}`,"");else if(item.type==="note")lines.push(`> ${String(item.quote||"").replace(/\n/g,"\n> ")}`,"",`**メモ：** ${item.note||""}`,"");else if(item.type==="bookmark")lines.push(`### ☆ ${item.label||"しおり"}`,item.quote?`> ${item.quote}`:"","");}}
  const blob=new Blob([lines.join("\n")],{type:"text/markdown;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="markdown-reader-annotations-"+new Date().toISOString().slice(0,10)+".md";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast("注釈をMarkdownファイルとして出力しました。");
}

/* =========================
   ファイル一覧ペイン表示設定
   ========================= */
function applyLibraryVisibility(hidden, persist = true) {
  // 一覧の表示切替で本文の幅・高さが変わっても、最上部の行を保つ
  keepTopAnchor(() => {
  state.libraryHidden = !!hidden;
  $("app-main").classList.toggle("library-hidden", state.libraryHidden);
  const btn = $("library-pane-toggle");
  btn.textContent = state.libraryHidden ? "☰ ファイル一覧を表示" : "☰ ファイル一覧を隠す";
  btn.setAttribute("aria-expanded", state.libraryHidden ? "false" : "true");
  btn.title = state.libraryHidden ? "ファイル一覧ペインを再表示" : "ファイル一覧ペインを非表示";
  if (persist) {
    try { localStorage.setItem("md_reader_library_hidden", state.libraryHidden ? "1" : "0"); } catch (_) {}
  }
  });
}
function initLibraryVisibility() {
  let hidden = false;
  try { hidden = localStorage.getItem("md_reader_library_hidden") === "1"; } catch (_) {}
  applyLibraryVisibility(hidden, false);
}

/* =========================
   テーマ設定
   ========================= */
function applyTheme(theme) {
  state.theme = theme === "dark" ? "dark" : "light";
  document.body.dataset.theme = state.theme;
  $("theme-btn").textContent = state.theme === "dark" ? "☀️ ライト" : "🌙 ダーク";
  try { localStorage.setItem("md_reader_theme", state.theme); } catch(_){}
}
function initTheme() { let saved="light"; try { saved=localStorage.getItem("md_reader_theme")||"light"; } catch(_){} applyTheme(saved); }

/* =========================
   リンクの安全対策
   外部リンクは新しいタブで開き、opener経由の乗っ取りを防ぐ
   ========================= */
function initSanitizerHooks() {
  DOMPurify.addHook("afterSanitizeAttributes", node => {
    if (node.tagName === "A" && node.hasAttribute("href")) {
      if ((node.getAttribute("href") || "").startsWith("#")) return;
      node.setAttribute("target", "_blank");
      node.setAttribute("rel", "noopener noreferrer");
    }
  });
}

initTocResizer();

/* =========================
   イベント
   ========================= */
$("markdown-viewer").addEventListener("wheel", () => { state.lastLocalInteractionAt = Date.now(); }, { passive: true });
$("markdown-viewer").addEventListener("touchmove", () => { state.lastLocalInteractionAt = Date.now(); }, { passive: true });
$("markdown-viewer").addEventListener("keydown", () => { state.lastLocalInteractionAt = Date.now(); });
$("markdown-viewer").addEventListener("scroll", () => {
  updateReadingProgress();
  // 読み込み中・位置復元中のスクロールは保存しない（保存済みの位置を上書きしないため）
  if (!state.viewerReady || !state.currentFile || state.restoringPosition || Date.now() < state.suppressScrollUntil) return;
  state.lastLocalInteractionAt = Date.now();
  scheduleProgressSave(state.currentFile.id);
}, { passive: true });
$("theme-btn").addEventListener("click", () => applyTheme(state.theme === "dark" ? "light" : "dark"));
$("library-pane-toggle").addEventListener("click", () => applyLibraryVisibility(!state.libraryHidden));
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "b") {
    e.preventDefault(); applyLibraryVisibility(!state.libraryHidden);
  }
});
function setTocVisible(visible) {
  const panel=$("toc-panel"), layout=$("reader-layout");
  panel.classList.toggle("hidden", !visible);
  layout.classList.toggle("toc-visible", visible);
  $("toc-toggle").setAttribute("aria-expanded", String(visible));
  if (visible) { applyTocWidth(getSavedTocWidth()); const i=state.tocCurrent; state.tocCurrent=-2; setTocCurrent(i); }
}
function getSavedTocWidth() {
  let n=220; try { n=Number(localStorage.getItem("md_reader_toc_width")) || 220; } catch(_){}
  return Math.max(140, Math.min(420, n));
}
function applyTocWidth(width) {
  const w=Math.max(140,Math.min(420,Math.round(width)));
  document.documentElement.style.setProperty("--toc-width", w+"px");
  const r=$("toc-resizer"); r.setAttribute("aria-valuenow", String(w));
  try { localStorage.setItem("md_reader_toc_width", String(w)); } catch(_){}
}
function initTocResizer() {
  applyTocWidth(getSavedTocWidth());
  const handle=$("toc-resizer"); let dragging=false;
  const move=e=>{ if(!dragging)return; const layout=$("reader-layout").getBoundingClientRect(); applyTocWidth(e.clientX-layout.left); };
  const stop=()=>{ if(!dragging)return; dragging=false; handle.classList.remove("dragging"); document.body.style.cursor=""; document.body.style.userSelect=""; window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",stop); window.removeEventListener("pointercancel",stop); };
  handle.addEventListener("pointerdown",e=>{ if($("toc-panel").classList.contains("hidden"))return; dragging=true; handle.classList.add("dragging"); document.body.style.cursor="col-resize"; document.body.style.userSelect="none"; handle.setPointerCapture?.(e.pointerId); window.addEventListener("pointermove",move); window.addEventListener("pointerup",stop); window.addEventListener("pointercancel",stop); e.preventDefault(); });
  handle.addEventListener("keydown",e=>{ const current=getSavedTocWidth(); if(e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();applyTocWidth(current+(e.key==="ArrowRight"?20:-20));}});
}
$("toc-toggle").addEventListener("click",()=>keepTopAnchor(()=>setTocVisible($("toc-panel").classList.contains("hidden"))));
["font-size-select","line-height-select","content-width-select"].forEach(id=>$(id).addEventListener("change",saveReaderSettings));
$("focus-toggle").addEventListener("click",()=>keepTopAnchor(()=>{state.focusMode=!state.focusMode;$("markdown-viewer").classList.toggle("focus-mode",state.focusMode);if(state.focusMode){setTocVisible(false);}$("focus-toggle").textContent=state.focusMode?"通常表示":"集中モード";}));

/* 文字選択を保つ：PCはmousedownの既定動作を止め、iOSは選択変更のたびに直前の選択を保持する */
["highlight-btn","note-btn","bookmark-btn"].forEach(id => $(id).addEventListener("mousedown", e => e.preventDefault()));
document.addEventListener("selectionchange", () => {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || sel.isCollapsed) return;
  const r = sel.getRangeAt(0);
  if ($("markdown-viewer").contains(r.commonAncestorContainer)) state.lastSel = { range: r.cloneRange(), time: Date.now() };
});
$("highlight-btn").addEventListener("click",addHighlight);
$("note-btn").addEventListener("click",addNote);
$("bookmark-btn").addEventListener("click",addBookmark);
$("annotations-toggle").addEventListener("click",()=>{const p=$("annotations-panel");p.classList.toggle("hidden");if(!p.classList.contains("hidden"))renderAnnotations();});
$("save-tags-btn").addEventListener("click",saveCurrentFileTags);
$("tag-filter-input").addEventListener("input",()=>applyFilter());
$("queue-add-btn").addEventListener("click",addCurrentToQueue);
$("queue-toggle").addEventListener("click",()=>{const p=$("queue-panel");p.classList.toggle("hidden");if(!p.classList.contains("hidden"))renderQueuePanel();});
$("export-notes-btn").addEventListener("click",exportAnnotationsMarkdown);
$("fulltext-btn").addEventListener("click",searchRegisteredMarkdown);
$("fulltext-input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing&&e.keyCode!==229)searchRegisteredMarkdown();});
$("group-select").addEventListener("change", () => applyFilter());
$("add-group-btn").addEventListener("click", createGroup);
$("rename-group-btn").addEventListener("click", renameGroup);
$("delete-group-btn").addEventListener("click", deleteGroup);
$("login-btn").addEventListener("click", login);
$("logout-btn").addEventListener("click", logout);
$("sync-btn").addEventListener("click", syncDrive);
$("filter-input").addEventListener("input", () => applyFilter());
$("more-btn").addEventListener("click", () => renderMoreFiles());
$("show-registered-btn").addEventListener("click", () => setListMode("registered"));
$("show-search-btn").addEventListener("click", () => setListMode("search"));
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushProgress();
  else pollRemoteProgress();
});
window.addEventListener("pagehide", () => {
  if (state.currentFile && state.viewerReady && state.lastLocalInteractionAt > state.lastLocalSavedAt) {
    markLocalProgress(state.currentFile.id, captureReadingPosition());
    // pagehideでは完了保証がないため、直前の定期保存・デバウンス保存を主とする。
    queueProgressSave();
  }
});
window.addEventListener("beforeunload", () => {
  if (state.currentFile && state.viewerReady) {
    state.progress[state.currentFile.id] = {
      ...captureReadingPosition(), updatedAt: new Date().toISOString()
    };
    persistLocalProgress();
  }
});

(async function boot() {
  try {
    initTheme();
    initLibraryVisibility();
    applyReaderSettings();
    initSanitizerHooks();
    state.db = await openDatabase();
    await initAuth();
  } catch (err) {
    console.error(err);
    setListStatus("初期化エラー：" + describeError(err));
    showToast("初期化に失敗しました：" + describeError(err), 8000);
  }
})();
})();
</script>
