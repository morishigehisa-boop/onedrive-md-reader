<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneDrive Markdown Reader v3.7.1</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" integrity="sha384-JEyTNhjM6R1ElGoJns4U2Ln4ofPcqzSsynQkmEc/KGy6336qAZl70tDLufbkla+3" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js" integrity="sha384-B5PXeUfgiegchZiX5iMRssMrHd9NfPhFnITob1HyW1CY76udptWpBsniaDsH/+BY" crossorigin="anonymous"></script>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #markdown-viewer { font-size:.96rem; line-height:1.85; color:#334155; overflow-wrap:anywhere; }
  #markdown-viewer h1,#markdown-viewer h2,#markdown-viewer h3,#markdown-viewer h4 { color:#0f172a;font-weight:700;margin:1.7em 0 .7em;line-height:1.4; }
  #markdown-viewer h1 {font-size:1.65rem;border-bottom:2px solid #cbd5e1;padding-bottom:.4em}
  #markdown-viewer h2 {font-size:1.35rem;border-bottom:1px solid #e2e8f0;padding-bottom:.3em}
  #markdown-viewer h3 {font-size:1.12rem;border-left:4px solid #3b82f6;padding-left:.65em}
  #markdown-viewer p {margin:.8em 0}
  #markdown-viewer ul {list-style:disc;padding-left:1.6em;margin:.8em 0}
  #markdown-viewer ol {list-style:decimal;padding-left:1.6em;margin:.8em 0}
  #markdown-viewer li {margin:.25em 0}
  #markdown-viewer blockquote {border-left:4px solid #cbd5e1;padding:.5em 1em;background:#f8fafc;color:#64748b;margin:1em 0}
  #markdown-viewer code {background:#f1f5f9;color:#be123c;padding:.15em .35em;border-radius:4px;font-family:ui-monospace,monospace;font-size:.9em}
  #markdown-viewer pre {background:#1e293b;color:#f8fafc;padding:1em;border-radius:8px;overflow:auto;margin:1em 0}
  #markdown-viewer pre code {background:transparent;color:inherit;padding:0}
  #markdown-viewer table {border-collapse:collapse;width:100%;display:block;overflow-x:auto;margin:1em 0}
  #markdown-viewer th,#markdown-viewer td {border:1px solid #cbd5e1;padding:.5em .7em;text-align:left;min-width:100px}
  #markdown-viewer th {background:#f1f5f9}
  #markdown-viewer img {max-width:100%;height:auto}
  #markdown-viewer img.img-error {display:inline-block;padding:.3em .6em;border:1px dashed #cbd5e1;border-radius:4px;color:#94a3b8;font-size:.8em}
  #markdown-viewer a {color:#2563eb;text-decoration:underline}
  #markdown-viewer hr {border:0;border-top:1px solid #e2e8f0;margin:2em 0}
  .file-row.active {background:#eff6ff;border-color:#93c5fd}
  .group-heading {position:sticky;top:0;z-index:2;background:#f1f5f9;color:#475569;padding:.45rem .6rem;margin:.5rem 0 .2rem;border-radius:.45rem;font-size:.72rem;font-weight:700;display:flex;justify-content:space-between}
  body[data-theme="dark"] {background:#0b1220;color:#e2e8f0}
  body[data-theme="dark"] header, body[data-theme="dark"] aside, body[data-theme="dark"] section {background:#111c2e;border-color:#29364a;color:#e2e8f0}
  body[data-theme="dark"] header h1, body[data-theme="dark"] #list-title, body[data-theme="dark"] #current-file-name {color:#f1f5f9}
  body[data-theme="dark"] #markdown-viewer {color:#cbd5e1}
  body[data-theme="dark"] #markdown-viewer h1, body[data-theme="dark"] #markdown-viewer h2, body[data-theme="dark"] #markdown-viewer h3, body[data-theme="dark"] #markdown-viewer h4 {color:#f1f5f9}
  body[data-theme="dark"] #markdown-viewer h1 {border-color:#475569}
  body[data-theme="dark"] #markdown-viewer h2, body[data-theme="dark"] #markdown-viewer hr {border-color:#334155}
  body[data-theme="dark"] #markdown-viewer blockquote {background:#1e293b;color:#cbd5e1;border-color:#64748b}
  body[data-theme="dark"] #markdown-viewer code {background:#273449;color:#fda4af}
  body[data-theme="dark"] #markdown-viewer th {background:#263449}
  body[data-theme="dark"] #markdown-viewer th, body[data-theme="dark"] #markdown-viewer td {border-color:#475569}
  body[data-theme="dark"] .file-row.active {background:#1e3a5f;border-color:#3b82f6}
  body[data-theme="dark"] .file-row:hover {background:#1e293b}
  body[data-theme="dark"] .group-heading {background:#263449;color:#e2e8f0}
  body[data-theme="dark"] input, body[data-theme="dark"] select, body[data-theme="dark"] textarea {background:#1e293b;color:#e2e8f0;border-color:#475569}
  body[data-theme="dark"] button {border-color:#475569}
  body[data-theme="dark"] .text-slate-700 {color:#e2e8f0}
  body[data-theme="dark"] .text-slate-500, body[data-theme="dark"] .text-slate-400 {color:#94a3b8}

  #reader-toolbar {display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-bottom:.65rem;padding:.55rem;border:1px solid #e2e8f0;border-radius:.6rem;background:#f8fafc}
  #reader-toolbar button,#reader-toolbar select {font-size:.75rem;border:1px solid #cbd5e1;border-radius:.4rem;padding:.35rem .55rem;background:white;color:#334155}
  #reader-layout {display:flex;gap:.8rem;min-height:0;flex:1}
  #toc-panel {position:relative;width:var(--toc-width,220px);flex:0 0 var(--toc-width,220px);min-width:140px;max-width:420px;overflow:auto;border-right:1px solid #e2e8f0;padding-right:.6rem;font-size:.78rem}
  #toc-resizer {width:8px;flex:0 0 8px;cursor:col-resize;position:relative;touch-action:none;user-select:none;display:none}
  #toc-resizer::after {content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;background:#cbd5e1;border-radius:2px}
  #toc-resizer:hover::after,#toc-resizer.dragging::after {background:#3b82f6;width:3px;left:2.5px}
  #toc-resizer:focus-visible {outline:2px solid #3b82f6;outline-offset:-2px}
  #reader-layout.toc-visible #toc-resizer {display:block}
  body[data-theme="dark"] #toc-resizer::after {background:#475569}
  body[data-theme="dark"] #toc-resizer:hover::after,body[data-theme="dark"] #toc-resizer.dragging::after {background:#60a5fa}
  #toc-panel button {display:block;text-align:left;width:100%;padding:.28rem .4rem;border-radius:.3rem;color:#475569}
  #toc-panel button:hover {background:#e2e8f0}
  #toc-panel button.toc-active {background:#dbeafe;color:#1d4ed8;font-weight:700}
  #reader-main {display:flex;flex-direction:column;min-width:0;flex:1;min-height:0}
  #reading-progress-track {height:4px;background:#e2e8f0;border-radius:9px;overflow:hidden;margin-bottom:.55rem}
  #reading-progress-fill {height:100%;width:0;background:#2563eb;transition:width .12s}
  #markdown-viewer.focus-mode {max-width:900px;margin:auto;width:100%;padding-left:1rem;padding-right:1rem}
  #markdown-viewer mark.reader-highlight {background:#fde68a;color:#422006;border-radius:2px;padding:0 .05em}
  #markdown-viewer mark.reader-note {background:transparent;color:inherit;border-bottom:2px dotted #f59e0b}
  body[data-theme="dark"] #reader-toolbar {background:#172337;border-color:#334155}
  body[data-theme="dark"] #reader-toolbar button,body[data-theme="dark"] #reader-toolbar select {background:#1e293b;color:#e2e8f0;border-color:#475569}
  body[data-theme="dark"] #toc-panel {border-color:#334155}
  body[data-theme="dark"] #toc-panel button {color:#cbd5e1}
  body[data-theme="dark"] #toc-panel button:hover {background:#334155}
  body[data-theme="dark"] #toc-panel button.toc-active {background:#1e3a5f;color:#93c5fd}
  body[data-theme="dark"] #reading-progress-track {background:#334155}
  body[data-theme="dark"] #markdown-viewer mark.reader-highlight {background:#854d0e;color:#fef3c7}
  body[data-theme="dark"] #markdown-viewer mark.reader-note {background:transparent;color:inherit}
  body[data-theme="dark"] #markdown-viewer blockquote {background:#1e293b}
  body[data-theme="dark"] #markdown-viewer img.img-error {border-color:#475569}
  @media(max-width:760px){#reader-layout{gap:.4rem}}
  @media(max-width:520px){#toc-panel{display:none}#toc-resizer{display:none !important}}
  /* iOS Safari：16px未満の入力欄はフォーカス時に画面が勝手に拡大されるため */
  @media(max-width:760px){input,select,textarea{font-size:16px !important}}
  /* タッチ端末はボタンを押しやすく */
  @media(pointer:coarse){#reader-toolbar button,#reader-toolbar select{padding:.55rem .75rem;min-height:40px}}
  /* ファイル一覧ペインを隠したときは閲覧領域を最大化（dvh非対応ブラウザ向けにvhを先に書く） */
  #app-main.library-hidden > #library-pane { display:none !important; }
  #app-main.library-hidden > #viewer-panel { width:100%; height:calc(100vh - 6.5rem) !important; height:calc(100dvh - 6.5rem) !important; }
  #library-pane { transition: opacity .15s ease; }
  #library-pane-toggle { white-space:nowrap; }
  #tag-editor {min-width:150px;max-width:260px}
  #queue-panel {max-height:220px;overflow:auto}
  .tag-chip {display:inline-block;border:1px solid #cbd5e1;border-radius:999px;padding:.08rem .45rem;margin:.08rem;font-size:.68rem;background:#f1f5f9;color:#334155}
  body[data-theme="dark"] .tag-chip {background:#263449;color:#e2e8f0;border-color:#475569}
  .annotation-action {font-size:.7rem;color:#2563eb;text-decoration:underline;margin-right:.6rem}
  body[data-theme="dark"] .annotation-action {color:#93c5fd}
  .orphan-label {display:inline-block;margin-left:.4rem;padding:0 .4rem;border-radius:999px;background:#fee2e2;color:#b91c1c;font-size:.65rem;font-weight:600}
  body[data-theme="dark"] .orphan-label {background:#7f1d1d;color:#fecaca}
  #modal-box {background:#fff;color:#1e293b}
  body[data-theme="dark"] #modal-box {background:#111c2e;color:#e2e8f0}
  .spinner {width:15px;height:15px;border:2px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
  @keyframes spin {to{transform:rotate(360deg)}}
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
<header class="bg-white border-b border-slate-200 px-4 py-3 flex flex-wrap gap-3 justify-between items-center shadow-sm">
  <div class="flex items-center gap-2">
    <h1 class="text-lg font-bold text-slate-800">📖 OneDrive Markdown Reader</h1>
    <span class="bg-slate-800 text-white text-xs px-2 py-1 rounded-full">v3.7.1</span>
  </div>
  <div class="flex items-center gap-3">
    <span id="account-label" class="text-xs text-slate-500"></span>
    <button id="login-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">Microsoft ログイン</button>
    <button id="theme-btn" class="border border-slate-300 hover:bg-slate-100 px-3 py-2 rounded-lg text-sm" type="button">🌙 ダーク</button>
    <button id="logout-btn" class="hidden border border-slate-300 hover:bg-slate-100 px-3 py-2 rounded-lg text-sm">ログアウト</button>
  </div>
</header>

<main id="app-main" class="flex-1 w-full p-3 md:p-5 flex flex-col md:flex-row gap-4 min-h-0">
  <aside id="library-pane" class="w-full md:w-96 md:flex-shrink-0 bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col h-[42dvh] md:h-[calc(100dvh-6.5rem)]">
    <div class="flex justify-between items-center mb-3">
      <h2 id="list-title" class="text-sm font-bold text-slate-700">登録済み Markdown</h2>
      <button id="sync-btn" class="text-xs text-blue-700 hover:underline disabled:text-slate-400" disabled>一覧を同期</button>
    </div>
    <div class="flex gap-2 mb-2">
      <button id="show-registered-btn" class="flex-1 rounded-lg border px-2 py-2 text-xs bg-blue-50 border-blue-200 text-blue-700" disabled>登録済み</button>
      <button id="show-search-btn" class="flex-1 rounded-lg border px-2 py-2 text-xs hover:bg-slate-50" disabled>＋ OneDriveから追加</button>
    </div>
    <input id="filter-input" type="search" placeholder="登録済みファイルを絞り込み" class="border border-slate-300 rounded-lg px-3 py-2 text-sm w-full mb-2" disabled>
    <div class="flex gap-1 mb-2"><input id="fulltext-input" type="search" placeholder="登録文書の全文検索" class="border border-slate-300 rounded-lg px-2 py-2 text-xs min-w-0 flex-1" disabled><button id="fulltext-btn" class="border rounded-lg px-2 text-xs" disabled>検索</button></div>
    <div id="fulltext-results" class="hidden max-h-40 overflow-y-auto text-xs border rounded-lg mb-2"></div>
    <div class="flex gap-1 mb-2"><input id="tag-filter-input" type="search" placeholder="タグで絞り込み（例：融資）" class="border border-slate-300 rounded-lg px-2 py-2 text-xs min-w-0 flex-1" disabled><button id="queue-toggle" class="border rounded-lg px-2 text-xs" type="button">読書キュー</button></div>
    <div id="queue-panel" class="hidden border rounded-lg p-2 mb-2 text-xs"></div>
    <div class="flex gap-2 mb-2">
      <select id="group-select" class="border border-slate-300 rounded-lg px-2 py-2 text-xs flex-1" disabled aria-label="グループ"></select>
      <button id="add-group-btn" class="border border-slate-300 rounded-lg px-2 py-2 text-xs whitespace-nowrap" disabled>＋グループ</button>
    </div>
    <div class="flex gap-2 mb-2">
      <button id="rename-group-btn" class="border border-slate-200 rounded px-2 py-1 text-[10px]" disabled>名前変更</button>
      <button id="delete-group-btn" class="border border-slate-200 rounded px-2 py-1 text-[10px]" disabled>グループ削除</button>
    </div>
    <div class="flex justify-between text-xs text-slate-500 mb-2">
      <span id="file-count">0 件</span>
      <span id="sync-time">未同期</span>
    </div>
    <div id="list-status" class="text-xs text-slate-500 mb-2">Microsoftログイン後に一覧を同期します。</div>
    <div id="file-list" class="overflow-y-auto flex-1 space-y-1 text-sm min-h-0">
      <div class="text-center text-slate-400 text-xs py-8">ログインしてください。</div>
    </div>
    <button id="more-btn" class="hidden mt-2 w-full border rounded-lg py-2 text-xs hover:bg-slate-50">さらに表示</button>
  </aside>

  <section id="viewer-panel" class="flex-1 min-w-0 bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:p-6 flex flex-col h-[55dvh] md:h-[calc(100dvh-6.5rem)]">
    <div id="viewer-header" class="hidden border-b pb-3 mb-3 flex justify-between gap-3 items-center">
      <div class="min-w-0">
        <div id="current-file-name" class="font-bold text-slate-800 truncate"></div>
        <div id="current-file-path" class="text-xs text-slate-400 truncate"></div>
      </div>
      <span id="progress-status" class="text-xs text-slate-500 whitespace-nowrap">閲覧位置</span>
    </div>
    <div id="reader-toolbar">
      <button id="library-pane-toggle" type="button" aria-expanded="true" title="ファイル一覧ペインの表示・非表示を切り替え">☰ ファイル一覧を隠す</button>
      <button id="toc-toggle" type="button">☷ 目次</button>
      <label class="text-xs">文字 <select id="font-size-select"><option value="14">小</option><option value="15" selected>標準</option><option value="17">大</option><option value="19">特大</option></select></label>
      <label class="text-xs">行間 <select id="line-height-select"><option value="1.5">狭い</option><option value="1.75">標準</option><option value="2">広い</option><option value="2.2">ゆったり</option></select></label>
      <label class="text-xs">本文幅 <select id="content-width-select"><option value="100%">広い</option><option value="900px" selected>標準</option><option value="700px">狭い</option></select></label>
      <button id="focus-toggle" type="button">集中モード</button>
      <button id="highlight-btn" type="button">🖍 マーカー</button>
      <button id="note-btn" type="button">✎ メモ</button>
      <button id="bookmark-btn" type="button">☆ しおり</button>
      <button id="annotations-toggle" type="button">注釈一覧</button>
      <input id="tag-editor" type="text" placeholder="タグ（カンマ区切り）" title="この文書のタグ" class="border rounded px-2 py-1 text-xs">
      <button id="save-tags-btn" type="button">タグ保存</button>
      <button id="queue-add-btn" type="button">＋読書キュー</button>
      <button id="export-notes-btn" type="button">注釈をMarkdown出力</button>
    </div>
    <div id="reading-progress-track"><div id="reading-progress-fill"></div></div>
    <div id="reader-layout">
      <nav id="toc-panel" class="hidden" aria-label="目次"><div class="text-slate-400 p-2">見出しはありません</div></nav>
      <div id="toc-resizer" role="separator" aria-label="目次の幅を変更" aria-orientation="vertical" aria-valuemin="140" aria-valuemax="420" tabindex="0" title="ドラッグして目次の幅を変更"></div>
      <div id="reader-main">
        <div id="annotations-panel" class="hidden border rounded-lg p-2 mb-2 max-h-40 overflow-y-auto text-xs"></div>
        <div id="markdown-viewer" class="overflow-y-auto flex-1 min-h-0 pr-2">
          <div class="text-center py-20 text-slate-400"><p class="text-lg mb-2">Markdownファイルを選択してください。</p><p class="text-sm">閲覧位置はファイルごとに自動保存されます。</p></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="modal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/50 p-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div id="modal-box" class="w-full max-w-md rounded-xl shadow-xl p-4">
    <div id="modal-title" class="font-bold mb-2"></div>
    <div id="modal-quote" class="hidden text-xs text-slate-500 mb-2 max-h-20 overflow-auto border-l-4 border-slate-300 pl-2"></div>
    <textarea id="modal-input" rows="4" class="w-full border border-slate-300 rounded-lg p-2 text-base"></textarea>
    <div class="flex justify-end gap-2 mt-3">
      <button id="modal-cancel" type="button" class="border border-slate-300 rounded-lg px-4 py-2 text-sm">キャンセル</button>
      <button id="modal-ok" type="button" class="bg-blue-600 text-white rounded-lg px-4 py-2 text-sm">保存</button>
    </div>
  </div>
</div>

<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 hidden max-w-[90vw] bg-slate-900 text-white text-sm px-4 py-3 rounded-lg shadow-lg z-50"></div>

<script>
(() => {
"use strict";

/* =========================
   設定
   ========================= */
const CONFIG = {
  CLIENT_ID: "3c6cf6bf-6af7-4bd0-ad41-cca85929f8b6",
  AUTHORITY: "https://login.microsoftonline.com/consumers",
  REDIRECT_URI: window.location.origin + window.location.pathname,
  SCOPES: ["User.Read", "Files.ReadWrite"],
  GRAPH: "https://graph.microsoft.com/v1.0",
  DB_NAME: "OneDriveMarkdownReader",
  DB_VERSION: 2,                    // v2: 全文検索キャッシュ用ストア"fulltext"を追加
  PROGRESS_FILE: "reading-progress.json",
  PAGE_SIZE: 200,
  RENDER_BATCH: 200,
  SAVE_DELAY: 700,
  PERIODIC_SAVE_INTERVAL: 10000,
  REMOTE_POLL_INTERVAL: 20000,      // eTag確認のみで差分がなければ本文を取得しないため20秒で十分
  REMOTE_APPLY_IDLE_MS: 3000,
  TOMBSTONE_TTL_DAYS: 90,           // 削除済み注釈の墓標を残す期間
  SEARCH_CONCURRENCY: 4,
  IMAGE_CONCURRENCY: 4,
  IMAGE_WAIT_MS: 2500
};

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const state = {
  msal: null,
  account: null,
  token: null,
  files: [],
  registeredFiles: [],
  filtered: [],
  listMode: "registered",
  rendered: 0,
  listSignature: "",
  currentFile: null,
  openRequest: 0,
  openController: null,
  viewerReady: false,
  saveTimer: null,
  saveChain: Promise.resolve(),
  progress: {},
  db: null,
  syncing: false,
  toastTimer: null,
  periodicSaveTimer: null,
  remotePollTimer: null,
  lastLocalInteractionAt: 0,
  lastLocalSavedAt: 0,
  suppressScrollUntil: 0,
  progressBusy: false,
  localRevision: 0,
  lastRemoteProgress: null,
  remoteETag: null,
  progressFileSeen: false,
  pollInFlight: false,
  pendingLocalFileIds: new Set(),
  progressDirty: false,
  groups: [],
  theme: "light",
  restoringPosition: false,
  annotations: {},
  readingQueue: [],
  fileTags: {},
  fullTextCache: new Map(),
  searchToken: 0,
  focusMode: false,
  libraryHidden: false,
  blocks: [],
  blocksByFp: new Map(),
  lastSel: null,
  orphanIds: new Set(),
  blobUrls: [],
  headings: [],
  tocButtons: [],
  tocObserver: null,
  tocCurrent: -1,
  lastSaveErrorToastAt: 0
};

function showToast(message, ms = 4500) {
  const el = $("toast");
  el.textContent = message;
  el.classList.remove("hidden");
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => el.classList.add("hidden"), ms);
}
function setListStatus(message) { $("list-status").textContent = message; }
function setProgressStatus(message) { $("progress-status").textContent = message; }
function errorMessage(err) {
  if (!err) return "原因不明のエラー";
  return err.message || String(err);
}
function fmtDateTime(date) {
  return date.toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

/* Graph APIのエラー。statusで原因を判定できるようにする */
class GraphError extends Error {
  constructor(status, message, extra) {
    super(message);
    this.name = "GraphError";
    this.status = status;
    if (extra) Object.assign(this, extra);
  }
}
/* 画面に出すエラー文を原因別に分ける */
function describeError(err) {
  if (err instanceof GraphError) {
    if (err.status === 401 || err.status === 403) return "認証の期限切れ、または権限不足です。ログインし直してください。";
    if (err.status === 409 || err.status === 412) return "他の端末の更新と重なりました。自動で再試行します。";
    if (err.status === 429 || err.status >= 500) return "OneDriveが混み合っています。時間をおいて自動で再試行します。";
    return errorMessage(err);
  }
  if (err && err.code === "BAD_JSON") return errorMessage(err);
  if (err instanceof TypeError || (typeof navigator !== "undefined" && navigator.onLine === false)) {
    return "ネットワークに接続できません。通信状況を確認してください。";
  }
  return errorMessage(err);
}

/* =========================
   入力ダイアログ（iOSでも使いやすい独自モーダル）
   ========================= */
function showTextModal({ title, quote = "", value = "", placeholder = "", multiline = false, okLabel = "保存" }) {
  return new Promise(resolve => {
    const modal = $("modal"), input = $("modal-input"), ok = $("modal-ok"), cancel = $("modal-cancel");
    $("modal-title").textContent = title;
    const q = $("modal-quote");
    q.textContent = quote;
    q.classList.toggle("hidden", !quote);
    input.value = value;
    input.placeholder = placeholder;
    input.rows = multiline ? 4 : 1;
    ok.textContent = okLabel;
    modal.classList.remove("hidden");
    modal.classList.add("flex");

    function close(result) {
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      ok.removeEventListener("click", onOk);
      cancel.removeEventListener("click", onCancel);
      input.removeEventListener("keydown", onKey);
      modal.removeEventListener("click", onBackdrop);
      resolve(result);
    }
    function onOk() { close(input.value); }
    function onCancel() { close(null); }
    function onKey(e) {
      if (e.isComposing || e.keyCode === 229) return; // 日本語変換中のEnterは確定として扱う
      if (e.key === "Escape") { e.preventDefault(); onCancel(); }
      else if (e.key === "Enter" && (!multiline || e.metaKey || e.ctrlKey)) { e.preventDefault(); onOk(); }
    }
    function onBackdrop(e) { if (e.target === modal) onCancel(); }
    ok.addEventListener("click", onOk);
    cancel.addEventListener("click", onCancel);
    input.addEventListener("keydown", onKey);
    modal.addEventListener("click", onBackdrop);
    input.focus(); // iOSでキーボードを出すため、タップ操作と同じ流れで同期的にフォーカスする
    input.select();
  });
}

/* =========================
   IndexedDB：ファイル一覧・全文検索キャッシュ
   ========================= */
function openDatabase() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(CONFIG.DB_NAME, CONFIG.DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("items")) db.createObjectStore("items", { keyPath: "id" });
      if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "key" });
      if (!db.objectStoreNames.contains("fulltext")) db.createObjectStore("fulltext", { keyPath: "id" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGet(storeName, key) {
  return new Promise((resolve, reject) => {
    const tx = state.db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const tx = state.db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function idbPutMany(storeName, records) {
  return new Promise((resolve, reject) => {
    const tx = state.db.transaction(storeName, "readwrite");
    const store = tx.objectStore(storeName);
    records.forEach(record => store.put(record));
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}
function idbDeleteMany(storeName, ids) {
  return new Promise((resolve, reject) => {
    const tx = state.db.transaction(storeName, "readwrite");
    const store = tx.objectStore(storeName);
    ids.forEach(id => store.delete(id));
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
function idbSetMeta(key, value) {
  return idbPutMany("meta", [{ key, value }]);
}

   MSAL認証
   ========================= */
async function initAuth() {
  if (!window.msal || !window.msal.PublicClientApplication) {
    throw new Error("MSALライブラリを読み込めません。CDN接続を確認してください。");
  }

  state.msal = new msal.PublicClientApplication({
    auth: {
      clientId: CONFIG.CLIENT_ID,
      authority: CONFIG.AUTHORITY,
      redirectUri: CONFIG.REDIRECT_URI,
      navigateToLoginRequestUrl: true
    },
    cache: {
      cacheLocation: "localStorage",
      storeAuthStateInCookie: false
    },
    system: {
      allowRedirectInIframe: false
    }
  });

  await state.msal.initialize();
  const redirectResult = await state.msal.handleRedirectPromise();

  if (redirectResult && redirectResult.account) {
    state.account = redirectResult.account;
    state.msal.setActiveAccount(state.account);
  } else {
    const accounts = state.msal.getAllAccounts();
    if (accounts.length) {
      state.account = state.msal.getActiveAccount() || accounts[0];
      state.msal.setActiveAccount(state.account);
    }
  }

  if (state.account) {
    await acquireToken();
    setLoggedInUI();
    await startApp();
  }
}

    await state.msal.loginRedirect({

      prompt: "select_account"
    });
  } catch (err) {
    showToast("ログイン開始エラー：" + errorMessage(err));

async function acquireToken() {
  if (!state.account) throw new Error("Microsoftアカウントが選択されていません。");
  try {
    const result = await state.msal.acquireTokenSilent({
      scopes: CONFIG.SCOPES,
      account: state.account
    });
    state.token = result.accessToken;
    return state.token;
  } catch (err) {
    if (err instanceof msal.InteractionRequiredAuthError ||
        err.errorCode === "interaction_required" ||
        err.errorCode === "login_required" ||
        err.errorCode === "consent_required") {
      await state.msal.acquireTokenRedirect({
        scopes: CONFIG.SCOPES,
        account: state.account
      });
      return null;
    }
    throw err;
  }
}

  await state.msal.logoutRedirect({ account: state.account });

/* =========================
   Microsoft Graph共通処理
   ========================= */
async function graphRequest(url, options = {}, retryAuth = true) {
  if (!state.token) await acquireToken();
  if (!state.token) throw new Error("アクセストークンを取得できませんでした。");

  const fullUrl = url.startsWith("http") ? url : CONFIG.GRAPH + url;
  const headers = new Headers(options.headers || {});
  headers.set("Authorization", "Bearer " + state.token);

  const response = await fetch(fullUrl, { ...options, headers });

  if (response.status === 401 && retryAuth) {
    state.token = null;
    await acquireToken();
    if (!state.token) throw new Error("再認証が必要です。");
    return graphRequest(url, options, false);
  }

  if (response.status === 429 || response.status === 503 || response.status === 504) {
    const retryAfter = Number(response.headers.get("Retry-After") || 3);
    throw new GraphError(response.status, `Microsoft Graphが一時的に混雑しています（${response.status}）。${retryAfter}秒後に再試行してください。`, { retryAfter });
  }

  if (!response.ok) {
    let detail = "";
    try {
      const body = await response.json();
      detail = body.error?.message || body.error?.code || "";
    } catch (_) {}
    throw new GraphError(response.status, `Graph APIエラー ${response.status}${detail ? "：" + detail : ""}`);
  }
  return response;
}
async function graphJson(url, options = {}) {
  const response = await graphRequest(url, options);
  if (response.status === 204) return null;
  return response.json();
}

/* =========================
   Delta同期
   初回はドライブ全体を列挙し、
   2回目以降はdeltaLinkで差分取得
   ========================= */
function toStoredItem(item) {
  return {
    id: item.id,
    name: item.name || "",
    parentId: item.parentReference?.id || null,
    isFolder: !!item.folder,
    isFile: !!item.file,
    size: item.size || 0,
    modified: item.lastModifiedDateTime || "",
    eTag: item.eTag || "",
    cTag: item.cTag || ""
  };
}
async function syncDrive() {
  if (state.syncing) return;
  state.syncing = true;
  $("sync-btn").disabled = true;
  $("sync-btn").textContent = "同期中…";
  setListStatus("OneDriveの変更を確認しています…");

  try {
    let deltaLink = (await idbGet("meta", "deltaLink"))?.value || null;
    let nextUrl = deltaLink || "/me/drive/root/delta?$top=" + CONFIG.PAGE_SIZE;
    let changed = [];
    let deleted = [];
    let pages = 0;
    let finalDeltaLink = null;

    while (nextUrl) {
      pages++;
      setListStatus(`ファイル情報を同期中… ${pages} ページ`);
      let response;
      try {
        response = await graphJson(nextUrl, {
          headers: { "Prefer": "odata.maxpagesize=" + CONFIG.PAGE_SIZE }
        });
      } catch (err) {
        // 古いdelta tokenが無効な場合は初回同期に戻す
        if (deltaLink && err instanceof GraphError && [400, 404, 410].includes(err.status)) {
          await idbSetMeta("deltaLink", null);
          deltaLink = null;
          nextUrl = "/me/drive/root/delta?$top=" + CONFIG.PAGE_SIZE;
          changed = [];
          deleted = [];
          pages = 0;
          continue;
        }
        throw err;
      }

      for (const item of (response.value || [])) {
        if (item.deleted) deleted.push(item.id);
        else changed.push(toStoredItem(item));
      }
      nextUrl = response["@odata.nextLink"] || null;
      finalDeltaLink = response["@odata.deltaLink"] || finalDeltaLink;
    }

    if (changed.length) await idbPutMany("items", changed);
    if (deleted.length) await idbDeleteMany("items", deleted);
    if (finalDeltaLink) await idbSetMeta("deltaLink", finalDeltaLink);

    await loadFileIndex();
    const now = new Date();
    await idbSetMeta("lastSync", now.toISOString());
    $("sync-time").textContent = fmtDateTime(now);
    setListStatus(`同期完了（変更 ${changed.length} 件 / 削除 ${deleted.length} 件）`);
    showToast("OneDriveのファイル一覧を同期しました。");
  } catch (err) {
    console.error(err);
    setListStatus("同期エラー：" + describeError(err));
    showToast("ファイル同期に失敗しました：" + describeError(err), 7000);
    // キャッシュがあれば表示を維持する
    await loadFileIndex().catch(console.error);
  } finally {
    state.syncing = false;
    $("sync-btn").disabled = false;
    $("sync-btn").textContent = "一覧を同期";
  }
}

/* =========================
   ファイル一覧・検索・パス
   ========================= */
async function loadFileIndex() {
  const all = await idbGetAll("items");
  const byId = new Map(all.map(x => [x.id, x]));
  const files = all.filter(x => x.isFile && /\.md$/i.test(x.name));

  // フォルダのパスをメモ化し、ファイル数が多くても親をたどり直さない
  const folderPathMemo = new Map();
  function folderPath(id) {
    if (!id || !byId.has(id)) return "";
    if (folderPathMemo.has(id)) return folderPathMemo.get(id);
    const chain = [];
    let cur = id, guard = 0;
    while (cur && byId.has(cur) && !folderPathMemo.has(cur) && guard++ < 200) {
      chain.push(cur);
      cur = byId.get(cur).parentId;
    }
    let base = (cur && folderPathMemo.has(cur)) ? folderPathMemo.get(cur) : "";
    for (let i = chain.length - 1; i >= 0; i--) {
      const f = byId.get(chain[i]);
      if (f.isFolder && f.name) base = base ? base + "/" + f.name : f.name;
      folderPathMemo.set(chain[i], base);
    }
    return folderPathMemo.get(id) ?? "";
  }
  function getPath(item) {
    const dir = folderPath(item.parentId);
    return dir ? dir + "/" + item.name : item.name;
  }

  state.files = files.map(item => ({ ...item, path: getPath(item) }))
    .sort((a, b) => a.path.localeCompare(b.path, "ja"));
  refreshRegisteredFiles();
  applyFilter();
}
function getGroupName(groupId) {
  if (!groupId || groupId === "__ungrouped") return "未分類";
  return state.groups.find(g => g.id === groupId && !g.deleted)?.name || "削除済みグループ";
}
function renderGroupSelect() {
  const select = $("group-select");
  const previous = select.value || "all";
  select.innerHTML = "";
  const all = document.createElement("option"); all.value = "all"; all.textContent = state.listMode === "search" ? "登録先：未分類" : "すべてのグループ"; select.appendChild(all);
  if (state.listMode !== "search") { const un = document.createElement("option"); un.value = "__ungrouped"; un.textContent = "未分類"; select.appendChild(un); }
  state.groups.filter(g=>!g.deleted).slice().sort((a,b)=>a.name.localeCompare(b.name,"ja")).forEach(g => {
    const o = document.createElement("option"); o.value = g.id; o.textContent = state.listMode === "search" ? `登録先：${g.name}` : g.name; select.appendChild(o);
  });
  select.value = [...select.options].some(o=>o.value===previous) ? previous : "all";
}
function persistLocalProgress() {
  try { localStorage.setItem("md_reader_progress_backup", JSON.stringify(state.progress)); } catch (_) {}
}
function markProgressChanged() {
  state.localRevision++;
  state.progressDirty = true;
  persistLocalProgress();
}
async function createGroup() {
  const name = await showTextModal({ title: "新しいグループ名", placeholder: "例：投資、節税", okLabel: "作成" });
  if (!name || !name.trim()) return;

  if (state.groups.some(g=>!g.deleted && g.name.toLocaleLowerCase()===clean.toLocaleLowerCase())) { showToast("同じ名前のグループがあります。"); return; }
  state.groups.push({id:"g_"+crypto.randomUUID(), name:clean, updatedAt:new Date().toISOString()});
  state.progress.__groups = state.groups;
  markProgressChanged();

async function renameGroup() {

  if (!name || !name.trim()) return;

  group.name=clean; group.updatedAt=new Date().toISOString(); state.progress.__groups=state.groups;
  markProgressChanged(); renderGroupSelect(); $("group-select").value=id; applyFilter(); await queueProgressSave();

async function deleteGroup() {
  const id=$("group-select").value;
  const group=state.groups.find(g=>g.id===id);
  if (!group) { showToast("削除するグループを選択してください。"); return; }
  const count=Object.values(state.progress.__registrations||{}).filter(r=>r.enabled && r.groupId===id).length;
  if (!confirm(`「${group.name}」を削除します。所属する${count}件のファイルは「未分類」に移動します。よろしいですか？`)) return;
  const deletedAt=new Date().toISOString();
  state.groups=state.groups.map(g=>g.id===id?{...g,deleted:true,updatedAt:deletedAt}:g);
  for (const r of Object.values(state.progress.__registrations||{})) if (r.groupId===id) { r.groupId="__ungrouped"; r.updatedAt=deletedAt; }
  state.progress.__groups=state.groups; markProgressChanged();
  renderGroupSelect(); $("group-select").value="all"; applyFilter(); await queueProgressSave();
}

/* 一覧の表示内容に影響する情報だけを文字列化。変化がなければ再描画しない */
function listSignature() {
  const regs = state.progress.__registrations || {};
  const tags = state.progress.__fileTags || {};
  return JSON.stringify([
    Object.entries(regs).filter(([, r]) => r && r.enabled).map(([id, r]) => [id, r.groupId || "", r.name || "", r.path || ""]).sort(),
    (state.progress.__groups || []).map(g => [g.id, g.name, !!g.deleted]).sort(),
    Object.entries(tags).map(([id, t]) => [id, (t.tags || []).join(",")]).sort()
  ]);
}
/* 同期後の一覧更新：変化があるときだけ再描画し、スクロール位置を保つ */
function syncListView() {
  refreshRegisteredFiles();
  const sig = listSignature();
  if (sig !== state.listSignature) {
    renderGroupSelect();
    applyFilter(true);
  }
}
function applyFilter(keepScroll = false) {
  const list = $("file-list");
  const prevTop = keepScroll ? list.scrollTop : 0;
  const prevRendered = keepScroll ? state.rendered : 0;
  const q = $("filter-input").value.trim().toLocaleLowerCase();
  const source = state.listMode === "search" ? state.files : state.registeredFiles;
  const selectedGroup = $("group-select").value || "all";
  const tagQuery = ($("tag-filter-input")?.value || "").trim().toLocaleLowerCase();
  state.filtered = source.filter(f => {
    const textMatch = !q || f.name.toLocaleLowerCase().includes(q) || f.path.toLocaleLowerCase().includes(q);
    const groupId = state.progress.__registrations?.[f.id]?.groupId || "__ungrouped";
    const groupMatch = state.listMode === "search" || selectedGroup === "all" || groupId === selectedGroup;
    const tags = state.progress.__fileTags?.[f.id]?.tags || [];
    const tagMatch = !tagQuery || tags.some(t => String(t).toLocaleLowerCase().includes(tagQuery));
    return textMatch && groupMatch && tagMatch;
  });
  state.listSignature = listSignature();
  state.rendered = 0;
  $("file-count").textContent = `${state.filtered.length.toLocaleString("ja-JP")} 件`;
  list.innerHTML = "";
  renderMoreFiles();
  while (state.rendered < Math.min(prevRendered, state.filtered.length)) renderMoreFiles();

}
function setListMode(mode) {

  $("filter-input").placeholder = searching ? "OneDrive内のファイル名・フォルダ名を検索" : "登録済みファイルを絞り込み";
  $("filter-input").value = "";
  renderGroupSelect();
  setListStatus(searching ? "同期済みのOneDrive全体からMarkdownファイルを検索します。未同期の場合は先に同期してください。" : "ここには登録したファイルだけを表示します。登録解除するまで一覧に残ります。");

async function saveRegistration(file, enabled) {
  const now = new Date().toISOString();
  state.progress.__registrations = state.progress.__registrations || {};
  const existing = state.progress.__registrations[file.id] || {};
  const chosenGroup = $("group-select").value;
  const groupId = enabled ? (chosenGroup && chosenGroup !== "all" ? chosenGroup : "__ungrouped") : (existing.groupId || "__ungrouped");
  state.progress.__registrations[file.id] = { ...existing, enabled, groupId, name: file.name, path: file.path, updatedAt: now };
  markProgressChanged();
  refreshRegisteredFiles();
  applyFilter(true);
  await queueProgressSave();
}
function refreshRegisteredFiles() {
  const map = new Map(state.files.map(f => [f.id, f]));
  const regs = state.progress.__registrations || {};
  state.registeredFiles = Object.entries(regs)
    .filter(([id, r]) => r && r.enabled)
    .map(([id, r]) => {
      const live = map.get(id);
      return live || { id, name: r.name || "（OneDrive上で見つかりません）", path: r.path || "", isMissing: true };
    })
    .sort((a,b) => getGroupName(a.groupId || regs[a.id]?.groupId).localeCompare(getGroupName(b.groupId || regs[b.id]?.groupId), "ja") || a.path.localeCompare(b.path, "ja"));
}
function renderMoreFiles() {
  const list = $("file-list");
  const start = state.rendered;
  const end = Math.min(start + CONFIG.RENDER_BATCH, state.filtered.length);
  const fragment = document.createDocumentFragment();
  let lastGroup = start > 0 ? (state.listMode === "registered" ? (state.progress.__registrations?.[state.filtered[start-1].id]?.groupId || "__ungrouped") : null) : null;
  for (let i = start; i < end; i++) {
    const file = state.filtered[i];
    const fileGroup = state.progress.__registrations?.[file.id]?.groupId || "__ungrouped";
    if (state.listMode === "registered" && fileGroup !== lastGroup) {
      const heading=document.createElement("div"); heading.className="group-heading";
      const count=state.filtered.filter(f=>(state.progress.__registrations?.[f.id]?.groupId||"__ungrouped")===fileGroup).length;
      heading.textContent=getGroupName(fileGroup)+"　"+count+"件"; fragment.appendChild(heading); lastGroup=fileGroup;
    }
    const row = document.createElement("div");
    row.dataset.fileId = file.id;
    row.className = "file-row flex items-start gap-1 p-2 rounded-lg border border-transparent hover:bg-slate-50";
    if (state.currentFile?.id === file.id) row.classList.add("active");
    const open = document.createElement("button");
    open.type = "button";
    open.className = "min-w-0 flex-1 text-left";
    const name = document.createElement("div");
    name.className = "font-medium text-slate-700 text-xs break-words";
    name.textContent = file.name;
    const path = document.createElement("div");
    path.className = "text-[10px] text-slate-400 break-all mt-1";
    path.textContent = file.path;
    open.append(name, path);
    const tags = state.progress.__fileTags?.[file.id]?.tags || [];
    if (tags.length) {
      const tagWrap = document.createElement("div");
      tagWrap.className = "mt-1";
      tags.forEach(t => { const chip = document.createElement("span"); chip.className = "tag-chip"; chip.textContent = t; tagWrap.appendChild(chip); });
      open.appendChild(tagWrap);
    }
    open.addEventListener("click", () => { if (!file.isMissing) openFile(file); });
    row.appendChild(open);
    const action = document.createElement("button");
    action.type = "button";
    action.className = "shrink-0 text-[10px] rounded border px-2 py-1 " + (state.listMode === "search" ? "text-blue-700 border-blue-200 hover:bg-blue-50" : "text-slate-500 border-slate-200 hover:bg-slate-100");
    const registered = !!state.progress.__registrations?.[file.id]?.enabled;
    action.textContent = state.listMode === "search" ? (registered ? "登録済み" : "登録") : "解除";
    action.disabled = state.listMode === "search" && registered;
    action.addEventListener("click", () => saveRegistration(file, state.listMode === "search"));
    row.appendChild(action);
    if (state.listMode === "registered") {
      const move=document.createElement("select"); move.className="shrink-0 text-[10px] border rounded px-1 py-1 bg-white";
      const options=[{id:"__ungrouped",name:"未分類"},...state.groups.filter(g=>!g.deleted)];
      options.forEach(g=>{const o=document.createElement("option");o.value=g.id;o.textContent=g.name;move.appendChild(o);});
      move.value=fileGroup;
      move.title="所属グループを変更";
      move.addEventListener("change", async()=>{
        const reg=state.progress.__registrations[file.id]; if(!reg)return;
        reg.groupId=move.value; reg.updatedAt=new Date().toISOString(); markProgressChanged();
        refreshRegisteredFiles(); applyFilter(true); await queueProgressSave();
      });
      row.appendChild(move);
    }
    fragment.appendChild(row);
  }
  list.appendChild(fragment);
  state.rendered = end;
  $("more-btn").classList.toggle("hidden", state.rendered >= state.filtered.length);
  if (!state.filtered.length) {
    list.innerHTML = `<div class="text-center text-slate-400 text-xs py-8">${state.listMode === "search" ? "該当するMarkdownファイルがありません。" : "登録済みファイルはありません。「OneDriveから追加」から登録してください。"}</div>`;
  }
}

/* =========================
   Markdown本文の取得・表示
   ========================= */
async function downloadDriveItem(fileId, signal) {
  if (!fileId) throw new Error("ファイルIDが空です。OneDrive一覧を再同期してください。");
  // /content はGraphの認証付きエンドポイント。302リダイレクト先をfetchが追跡するため、downloadUrl属性に依存しない。
  return graphRequest(`/me/drive/items/${encodeURIComponent(fileId)}/content`, { signal });
}

/* 全文検索キャッシュ（メモリ＋IndexedDB）。cTag（本文が変わると変わる）で更新を判定 */
function fileVersion(file) { return file.cTag || file.eTag || file.modified || ""; }
function cacheFullText(file, text) {
  const ver = fileVersion(file);
  if (!ver || file.isMissing) return;
  state.fullTextCache.set(file.id, { ver, text });
  idbPutMany("fulltext", [{ id: file.id, ver, text }]).catch(() => {});
}
async function getFullText(file) {
  const ver = fileVersion(file);
  const mem = state.fullTextCache.get(file.id);
  if (ver && mem && mem.ver === ver) return mem.text;
  if (ver) {
    try {
      const rec = await idbGet("fulltext", file.id);
      if (rec && rec.ver === ver) { state.fullTextCache.set(file.id, { ver, text: rec.text }); return rec.text; }
    } catch (_) {}
  }
  const response = await downloadDriveItem(file.id);
  const text = await response.text();
  cacheFullText(file, text);
  return text;
}

/* ---- 相対パス画像（./img/a.png など）をOneDriveから取得して表示 ---- */
const ABSOLUTE_URL = /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i;
/* 相対パス画像のsrcを退避する。<template>内は読み込みが始まらないため、無駄な404リクエストが出ない */
function detachRelativeImages(root) {
  const list = [];
  root.querySelectorAll("img").forEach(img => {
    const src = img.getAttribute("src") || "";
    if (!src || src.startsWith("#") || ABSOLUTE_URL.test(src)) return;
    img.dataset.relSrc = src;
    img.removeAttribute("src");
    list.push(img);
  });
  return list;
}
async function fetchRelativeAsset(file, src, signal) {
  const clean = src.split("#")[0].split("?")[0];
  let decoded;
  try { decoded = decodeURIComponent(clean); } catch (_) { decoded = clean; }
  const segs = decoded.split("/");
  let base = null;
  const rest = [];
  if (decoded.startsWith("/")) {
    segs.forEach(s => { if (s && s !== "." && s !== "..") rest.push(s); });
  } else {
    base = file.parentId || null;
    for (const s of segs) {
      if (s === "" || s === ".") continue;
      if (s === "..") {
        if (rest.length) rest.pop();
        else if (base) { const parent = await idbGet("items", base); base = parent?.parentId || null; }
      } else rest.push(s);
    }
  }
  if (!rest.length) throw new Error("画像のパスが不正です。");
  const encoded = rest.map(encodeURIComponent).join("/");
  const url = base
    ? `/me/drive/items/${encodeURIComponent(base)}:/${encoded}:/content`
    : `/me/drive/root:/${encoded}:/content`;
  return graphRequest(url, { signal });
}
async function loadRelativeImages(file, imgs, signal, requestId) {
  const cache = new Map();
  let cursor = 0;
  const worker = async () => {
    while (cursor < imgs.length) {
      const img = imgs[cursor++];
      if (requestId !== state.openRequest) return;
      const src = img.dataset.relSrc;
      try {
        let url = cache.get(src);
        if (!url) {
          const response = await fetchRelativeAsset(file, src, signal);
          url = URL.createObjectURL(await response.blob());
          cache.set(src, url);
          state.blobUrls.push(url);
        }
        if (requestId === state.openRequest) img.src = url;
      } catch (err) {
        if (err.name === "AbortError") return;
        img.alt = `（画像を読み込めません：${src}）`;
        img.classList.add("img-error");
      }
    }
  };
  await Promise.all(Array.from({ length: Math.min(CONFIG.IMAGE_CONCURRENCY, imgs.length) }, worker));
}
function revokeBlobUrls() {
  state.blobUrls.forEach(u => { try { URL.revokeObjectURL(u); } catch (_) {} });
  state.blobUrls = [];
}

async function openFile(file) {
  if (state.currentFile && state.currentFile.id !== file.id) await flushProgress();
  const requestId = ++state.openRequest;
  if (state.openController) state.openController.abort();
  state.openController = new AbortController();
  const signal = state.openController.signal;

  state.currentFile = file;
  state.viewerReady = false;
  state.lastLocalInteractionAt = 0;
  state.lastLocalSavedAt = 0;
  state.lastSel = null;
  state.orphanIds.clear();
  if (state.tocObserver) { state.tocObserver.disconnect(); state.tocObserver = null; }
  revokeBlobUrls();
  document.querySelectorAll(".file-row").forEach(el => el.classList.toggle("active", el.dataset.fileId === file.id));

  $("viewer-header").classList.remove("hidden");
  $("current-file-name").textContent = file.name;
  $("current-file-path").textContent = file.path;
  $("tag-editor").value = (state.progress.__fileTags?.[file.id]?.tags || []).join(", ");
  const viewer = $("markdown-viewer");
  viewer.innerHTML = '<div class="text-center py-12 text-slate-400"><span class="spinner"></span><p class="mt-3 text-sm">読み込み中…</p></div>';
  setProgressStatus("閲覧位置を確認中…");

  try {
    if (!file.id) throw new Error("ファイルIDがありません。OneDrive一覧を再同期してください。");
    const response = await downloadDriveItem(file.id, signal);
    if (!response.ok) throw new Error("本文のダウンロードに失敗しました（" + response.status + "）。");
    const markdown = await response.text();
    if (requestId !== state.openRequest) return;
    cacheFullText(file, markdown);

    const rawHtml = marked.parse(markdown, { gfm: true, breaks: false });
    const cleanHtml = DOMPurify.sanitize(rawHtml, {
      USE_PROFILES: { html: true },
      ADD_ATTR: ["target", "rel"]
    });
    const tpl = document.createElement("template");
    tpl.innerHTML = cleanHtml;
    const relativeImages = detachRelativeImages(tpl.content);
    viewer.replaceChildren(tpl.content);

    prepareMarkdownBlocks();
    buildTableOfContents();
    applySavedAnnotations(file.id);
    applyReaderSettings();
    if (relativeImages.length) {
      // 画像が揃うのを少し待つ（位置復元のズレ防止）。間に合わない分は裏で読み込みを続ける
      await Promise.race([loadRelativeImages(file, relativeImages, signal, requestId), sleep(CONFIG.IMAGE_WAIT_MS)]);
    }
    await waitForLayoutStable(viewer);
    if (requestId !== state.openRequest) return;
    await pollRemoteProgress(true);
    if (requestId !== state.openRequest) return;
    const saved = state.progress[file.id];
    state.suppressScrollUntil = Date.now() + 900;
    state.restoringPosition = true;
    restoreReadingPosition(saved);
    requestAnimationFrame(() => { state.restoringPosition = false; });
    updateReadingProgress();
    syncTocCurrent();
    renderAnnotations();
    setProgressStatus(saved ? "閲覧位置を復元しました" : "新規ファイル");
    state.viewerReady = true;
  } catch (err) {
    if (err.name === "AbortError") return;
    console.error(err);
    viewer.textContent = "本文の読み込みに失敗しました：" + describeError(err);
    setProgressStatus("読み込み失敗");
  }
}

/* =========================
   読書位置アンカー（v3.3〜）
   v3.7：ブロックのフィンガープリント・見出しパスを開いた時に1回だけ計算してキャッシュ
   ========================= */
const BLOCK_SELECTOR = "h1,h2,h3,h4,h5,h6,p,li,blockquote,pre,table,figure";
function normalizeText(value) { return String(value||"").replace(/\s+/g," ").trim().toLocaleLowerCase(); }
function fingerprint(value) {
  const text=normalizeText(value); let h=2166136261;
  for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619);}
  return (h>>>0).toString(16);
}
function blockText(el) { return (el.innerText || el.textContent || "").replace(/\s+/g," ").trim().slice(0,1200); }
function prepareMarkdownBlocks() {
  const viewer = $("markdown-viewer");
  const levels = {};
  const blocks = [];
  const byFp = new Map();
  for (const el of viewer.querySelectorAll(BLOCK_SELECTOR)) {
    const text = blockText(el);
    if (!text) continue;
    // 見出しパスは「そのブロックより前にある見出し」で決まる（見出し自身は自分のパスに含めない）
    const hp = [1,2,3,4,5,6].filter(i => levels[i]).map(i => levels[i]);
    if (/^H[1-6]$/.test(el.tagName)) {
      const lv = Number(el.tagName.slice(1));
      levels[lv] = normalizeText(el.textContent);
      for (let k = lv + 1; k <= 6; k++) delete levels[k];
    }
    const fp = fingerprint(text);
    const block = { el, fp, hp, hpKey: hp.join("/"), text: text.slice(0,240) };
    blocks.push(block);
    if (!byFp.has(fp)) byFp.set(fp, []);
    byFp.get(fp).push(block);
  }
  state.blocks = blocks;
  state.blocksByFp = byFp;
}
function captureReadingPosition() {
  const viewer=$("markdown-viewer"), blocks=state.blocks;
  const ratio=viewer.scrollHeight>viewer.clientHeight?viewer.scrollTop/(viewer.scrollHeight-viewer.clientHeight):0;
  if(!blocks.length)return {scrollTop:viewer.scrollTop,scrollRatio:ratio};
  const vr=viewer.getBoundingClientRect(), targetY=vr.top+Math.min(90,viewer.clientHeight*.15);
  // 文書順に並んだブロックから、上端が基準線以上にある最後のブロックを二分探索
  let lo=0, hi=blocks.length-1, idx=-1;
  while(lo<=hi){const mid=(lo+hi)>>1; if(blocks[mid].el.getBoundingClientRect().top<=targetY){idx=mid;lo=mid+1;}else hi=mid-1;}
  let block;
  if(idx<0) block=blocks[0];
  else { block = blocks[idx].el.getBoundingClientRect().bottom>=targetY ? blocks[idx] : (blocks[idx+1]||blocks[idx]); }
  const rect=block.el.getBoundingClientRect();
  return {
    anchorVersion:1, headingPath:block.hp, blockType:block.el.tagName.toLowerCase(),
    blockFingerprint:block.fp, blockText:block.text, occurrence:state.blocksByFp.get(block.fp).indexOf(block),
    blockProgress:rect.height>0?Math.max(0,Math.min(1,(targetY-rect.top)/rect.height)):0,
    viewportFraction:viewer.clientHeight?Math.min(.2,90/viewer.clientHeight):.1,
    scrollTop:viewer.scrollTop,
    scrollRatio:ratio
  };
}
function restoreReadingPosition(saved) {
  const viewer=$("markdown-viewer"); if(!saved){viewer.scrollTop=0;return;}
  const blocks=state.blocks; let target=null;
  if(saved.blockFingerprint && blocks.length){
    let candidates=state.blocksByFp.get(saved.blockFingerprint)||[];
    if(candidates.length){
      const path=(saved.headingPath||[]).join("/"), matched=candidates.filter(b=>b.hpKey===path);
      if(matched.length)candidates=matched;
      target=candidates[Math.max(0,Math.min(candidates.length-1,Number(saved.occurrence)||0))].el;
    }
  }
  if(!target && saved.blockText && blocks.length){
    const needle=normalizeText(saved.blockText).slice(0,100);
    const hit=blocks.find(b=>normalizeText(blockText(b.el)).includes(needle));
    if(hit) target=hit.el;
  }
  if(target){
    const rect=target.getBoundingClientRect(), vr=viewer.getBoundingClientRect();
    const fraction=Math.max(0,Math.min(1,Number(saved.blockProgress)||0));
    const viewportFraction=Math.max(.05,Math.min(.3,Number(saved.viewportFraction)||.12));
    const desiredY=rect.top+rect.height*fraction;
    viewer.scrollTop += desiredY-(vr.top+viewer.clientHeight*viewportFraction);
  } else if(Number.isFinite(Number(saved.scrollRatio)) && viewer.scrollHeight>viewer.clientHeight){
    viewer.scrollTop=(viewer.scrollHeight-viewer.clientHeight)*Math.max(0,Math.min(1,Number(saved.scrollRatio)));
  } else viewer.scrollTop=Number(saved.scrollTop)||0;
  viewer.scrollTop=Math.max(0,Math.min(viewer.scrollTop,viewer.scrollHeight-viewer.clientHeight));
}
async function waitForLayoutStable(viewer) {
  try { if(document.fonts?.ready) await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1200))]); } catch(_){}
  const images=[...viewer.querySelectorAll("img")].filter(img=>img.getAttribute("src"));
  await Promise.race([Promise.all(images.map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.addEventListener("load",resolve,{once:true});img.addEventListener("error",resolve,{once:true});}))),new Promise(r=>setTimeout(r,1800))]);
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
}

/* =========================
   閲覧位置の同期
   OneDrive上のJSONを端末間で共有
   ========================= */
function emptyProgressDoc() {
  return { version: 5, items: {}, __registrations: {}, __groups: [], __annotations: {}, __fileTags: {}, __readingQueue: [] };
}
function isNewerOrSame(a, b) { return new Date(a?.updatedAt || 0) >= new Date(b?.updatedAt || 0); }
/* 削除済み(deleted:true)の墓標は一定期間残し、他端末の古いデータが復活するのを防ぐ */
function keepRecord(x) {
  if (!x.deleted) return true;
  return Date.now() - new Date(x.updatedAt || 0).getTime() < CONFIG.TOMBSTONE_TTL_DAYS * 86400000;
}
function mergeProgress(a, b) {
  const merged = emptyProgressDoc();
  const allIds = new Set([...Object.keys(a?.items || {}), ...Object.keys(b?.items || {})]);
  for (const id of allIds) {
    const av = a?.items?.[id], bv = b?.items?.[id];
    if (!av) merged.items[id] = bv;
    else if (!bv) merged.items[id] = av;
    else merged.items[id] = isNewerOrSame(av, bv) ? av : bv;
  }
  const regIds = new Set([...Object.keys(a?.__registrations || {}), ...Object.keys(b?.__registrations || {})]);
  for (const id of regIds) {
    const av = a?.__registrations?.[id], bv = b?.__registrations?.[id];
    if (!av) merged.__registrations[id] = bv;
    else if (!bv) merged.__registrations[id] = av;
    else merged.__registrations[id] = isNewerOrSame(av, bv) ? av : bv;
  }
  const groupMap=new Map();
  for(const g of [...(a?.__groups||[]),...(b?.__groups||[])]) {
    if(!g?.id)continue; const old=groupMap.get(g.id);
    if(!old || isNewerOrSame(g, old))groupMap.set(g.id,g);
  }
  merged.__groups=[...groupMap.values()];
  const annotationIds=new Set([...Object.keys(a?.__annotations||{}),...Object.keys(b?.__annotations||{})]);
  for(const fileId of annotationIds){
    const byId=new Map();
    for(const item of [...(a?.__annotations?.[fileId]||[]),...(b?.__annotations?.[fileId]||[])]){
      if(!item?.id)continue; const old=byId.get(item.id);
      if(!old || isNewerOrSame(item, old))byId.set(item.id,item);
    }
    const list=[...byId.values()].filter(keepRecord);
    if(list.length)merged.__annotations[fileId]=list;
  }
  const tagIds=new Set([...Object.keys(a?.__fileTags||{}),...Object.keys(b?.__fileTags||{})]);
  for(const fileId of tagIds){
    const av=a?.__fileTags?.[fileId], bv=b?.__fileTags?.[fileId];
    merged.__fileTags[fileId]=!av?bv:!bv?av:(isNewerOrSame(av, bv)?av:bv);
  }
  const queueMap=new Map();
  for(const q of [...(a?.__readingQueue||[]),...(b?.__readingQueue||[])]){
    if(!q?.fileId)continue; const old=queueMap.get(q.fileId);
    if(!old || isNewerOrSame(q, old))queueMap.set(q.fileId,q);
  }
  merged.__readingQueue=[...queueMap.values()].filter(keepRecord);
  return merged;
}
/* 進捗ファイルのメタ情報（id・eTag）だけを軽く取得。ファイルが無ければnull */
async function fetchProgressMeta() {
  try {
    return await graphJson(`/me/drive/root:/${encodeURIComponent(CONFIG.PROGRESS_FILE)}?$select=id,eTag`);
  } catch (err) {
    if (err instanceof GraphError && err.status === 404) {
      // 一度でも存在を確認したファイルが急に404になった場合は、空データ扱いにせず中断する（上書き事故の防止）
      if (state.progressFileSeen) throw new GraphError(404, "読書履歴ファイルを一時的に取得できませんでした。しばらくしてから再試行します。");
      return null;
    }
    throw err;
  }
}
async function getRemoteProgressSnapshot(knownMeta) {
  const meta = knownMeta === undefined ? await fetchProgressMeta() : knownMeta;
  if (!meta) return { data: emptyProgressDoc(), id: null, eTag: null };
  const response = await graphRequest(`/me/drive/items/${encodeURIComponent(meta.id)}/content`);
  const raw = await response.text();
  let data;
  try { data = JSON.parse(raw || "{}"); }
  catch (_) {
    const e = new Error("reading-progress.jsonのJSON形式が不正です。元ファイルを保護するため上書きしません。");
    e.code = "BAD_JSON";
    throw e;
  }
  if (!data || typeof data !== "object") data = emptyProgressDoc();
  state.progressFileSeen = true;
  state.remoteETag = meta.eTag || null;
  return { data, id: meta.id, eTag: meta.eTag || null };
}
async function downloadProgressFile() {
  return (await getRemoteProgressSnapshot()).data;
}
async function uploadProgressFile(data, snapshot) {
  const body = JSON.stringify(data);
  let url, headers = { "Content-Type": "text/plain; charset=utf-8" };
  if (snapshot?.id) {
    url = `/me/drive/items/${encodeURIComponent(snapshot.id)}/content`;
    if (snapshot.eTag) headers["If-Match"] = snapshot.eTag;
  } else {
    url = `/me/drive/root:/${encodeURIComponent(CONFIG.PROGRESS_FILE)}:/content`;
    headers["If-None-Match"] = "*";
  }
  return graphRequest(url, { method: "PUT", headers, body });
}
function markLocalProgress(fileId, position) {
  if (!fileId) return;
  state.progress[fileId] = { ...(typeof position === "object" ? position : {scrollTop:position}), updatedAt: new Date().toISOString() };
  state.localRevision++;
  state.pendingLocalFileIds.add(fileId);
  state.progressDirty = true;
  state.lastLocalSavedAt = state.lastLocalInteractionAt;
  persistLocalProgress();
}
function scheduleProgressSave(fileId) {
  if (!fileId) return;
  clearTimeout(state.saveTimer);
  setProgressStatus("未保存の変更あり");
  state.saveTimer = setTimeout(() => {
    if (!state.viewerReady || state.currentFile?.id !== fileId) return;
    markLocalProgress(fileId, captureReadingPosition());
    queueProgressSave();
  }, CONFIG.SAVE_DELAY);
}
function toProgressDocument(flat) {
  return {
    version: 5,
    items: Object.fromEntries(Object.entries(flat || {}).filter(([key]) => !["__registrations","__groups","__annotations","__fileTags","__readingQueue"].includes(key))),
    __registrations: flat?.__registrations || {},
    __groups: flat?.__groups || [],
    __annotations: flat?.__annotations || {},
    __fileTags: flat?.__fileTags || {},
    __readingQueue: flat?.__readingQueue || []
  };
}
function fromProgressDocument(doc) {
  return { ...(doc?.items || {}), __registrations: doc?.__registrations || {}, __groups: doc?.__groups || [], __annotations: doc?.__annotations || {}, __fileTags: doc?.__fileTags || {}, __readingQueue: doc?.__readingQueue || [] };
}
async function queueProgressSave() {
  state.saveChain = state.saveChain.then(async () => {
    if (!state.account) return;
    state.progressBusy = true;
    setProgressStatus("OneDriveに保存中…");
    try {
      // ETagによる条件付き更新。競合(409/412)時は再取得・再マージして最大3回試行。
      let saved = false;
      for (let attempt = 0; attempt < 3 && !saved; attempt++) {
        const revisionAtStart = state.localRevision;
        const localSnapshot = toProgressDocument(state.progress);
        const remoteSnapshot = await getRemoteProgressSnapshot();
        const merged = mergeProgress(remoteSnapshot.data, localSnapshot);
        try {
          const response = await uploadProgressFile(merged, remoteSnapshot);
          // 自分の書き込み後のeTagを覚え、次のポーリングで無駄な再取得をしない
          const info = await response.json().catch(() => null);
          state.remoteETag = info?.eTag || null;
          state.progressFileSeen = true;
          const latestLocal = toProgressDocument(state.progress);
          const combined = mergeProgress(merged, latestLocal);
          state.progress = fromProgressDocument(combined);
          state.lastRemoteProgress = combined;
          if (state.localRevision === revisionAtStart) {
            state.pendingLocalFileIds.clear();
            state.progressDirty = false;
          } else {
            state.progressDirty = true;
            for (const [id, item] of Object.entries(latestLocal.items || {})) {
              if (new Date(item.updatedAt || 0) > new Date(merged.items?.[id]?.updatedAt || 0)) state.pendingLocalFileIds.add(id);
            }
          }
          persistLocalProgress();
          saved = true;
        } catch (err) {
          const conflict = err instanceof GraphError && (err.status === 412 || err.status === 409);
          if (!conflict || attempt === 2) throw err;
        }
      }

async function pollRemoteProgress(force = false) {

    if (!force && meta.eTag && meta.eTag === state.remoteETag) return;
    const remote = await getRemoteProgressSnapshot(meta);
    const remoteDoc = remote.data;
    const currentId = state.currentFile?.id;
    const remoteItem = currentId ? remoteDoc.items?.[currentId] : null;
    const localItem = currentId ? state.progress[currentId] : null;
    const remoteIsNewer = remoteItem && (!localItem || new Date(remoteItem.updatedAt || 0) > new Date(localItem.updatedAt || 0));
    const hasPendingCurrent = currentId && state.pendingLocalFileIds.has(currentId);
    const userIsActive = Date.now() - state.lastLocalInteractionAt < CONFIG.REMOTE_APPLY_IDLE_MS;

    // 他端末の新しい位置は、こちらで操作中でない場合だけ自動反映する。
    if (remoteIsNewer && !hasPendingCurrent && !userIsActive) {

        state.restoringPosition = true; restoreReadingPosition(remoteItem); requestAnimationFrame(()=>{state.restoringPosition=false;});
        syncTocCurrent();

      }
    }

    // 登録一覧も他端末の変更を取り込む。未送信のローカル変更は新しい時刻を優先。
    const localDoc = toProgressDocument(state.progress);
    const merged = mergeProgress(remoteDoc, localDoc);
    // 操作中・未送信の現在ファイルはローカル値を維持し、次回ポーリングで再判定する。
    if (currentId && (userIsActive || hasPendingCurrent)) {
      if (localDoc.items?.[currentId]) merged.items[currentId] = localDoc.items[currentId];
      else delete merged.items[currentId];
    }
    state.progress = fromProgressDocument(merged);
    state.groups = state.progress.__groups || [];
    state.fileTags = state.progress.__fileTags || {};
    state.readingQueue = state.progress.__readingQueue || [];
    state.lastRemoteProgress = remoteDoc;

    if (!$("queue-panel").classList.contains("hidden")) renderQueuePanel();

}
function startProgressSync() {

/* ---- 表示の幅・文字サイズが変わっても、画面最上部の行を動かさない ---- */
function anchorTopOf(node,offset){
  if(node.nodeType===3){
    const len=node.nodeValue.length;
    if(!len)return node.parentElement.getBoundingClientRect().top;
    const o=Math.min(offset,len-1), rg=document.createRange();
    rg.setStart(node,o); rg.setEnd(node,o+1);
    const rects=rg.getClientRects();
    return (rects.length?rects[0]:rg.getBoundingClientRect()).top;
  }
  const rects=node.getClientRects?node.getClientRects():[];
  return (rects.length?rects[0]:node.parentElement.getBoundingClientRect()).top;
}
function captureTopAnchor(){
  const v=$("markdown-viewer"), r=v.getBoundingClientRect();
  const x=r.left+Math.min(r.width/2,200), y=r.top+4; // 文字のある位置（左右の余白を避ける）
  let node=null, offset=0;
  if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(x,y); if(p){node=p.offsetNode;offset=p.offset;}}
  else if(document.caretRangeFromPoint){const rg=document.caretRangeFromPoint(x,y); if(rg){node=rg.startContainer;offset=rg.startOffset;}}
  if(!node||!v.contains(node))return null;
  return {node,offset,delta:anchorTopOf(node,offset)-r.top};
}
function keepTopAnchor(change){
  const a=state.viewerReady?captureTopAnchor():null;
  change();
  if(!a)return;
  const v=$("markdown-viewer");
  const fix=()=>{ if(!a.node.isConnected)return; v.scrollTop+=anchorTopOf(a.node,a.offset)-(v.getBoundingClientRect().top+a.delta); };
  state.suppressScrollUntil=Date.now()+600; state.restoringPosition=true;
  fix();
  // 画像・フォントの確定後にもう一度合わせる
  requestAnimationFrame(()=>{ fix(); requestAnimationFrame(()=>{
    state.restoringPosition=false; updateReadingProgress(); syncTocCurrent();
    if(state.currentFile&&state.viewerReady){state.lastLocalInteractionAt=Date.now();scheduleProgressSave(state.currentFile.id);}
  }); });
}
function saveReaderSettings(){

  try{localStorage.setItem("md_reader_settings",JSON.stringify(cfg));}catch(_){}

}

/* ---- 目次（現在位置のハイライト付き） ---- */
function buildTableOfContents(){
  const panel=$("toc-panel"), headings=[...$("markdown-viewer").querySelectorAll("h1,h2,h3,h4,h5,h6")];
  panel.innerHTML="";
  state.headings=headings; state.tocButtons=[]; state.tocCurrent=-1;
  if(!headings.length){panel.innerHTML='<div class="text-slate-400 p-2">見出しはありません</div>';setupTocObserver([]);return;}
  headings.forEach((h,i)=>{
    h.id="reader-heading-"+i;
    const b=document.createElement("button");
    b.type="button";
    b.textContent=h.textContent.trim()||"（無題）";
    b.style.paddingLeft=(.35+(Number(h.tagName.slice(1))-1)*.55)+"rem";
    b.addEventListener("click",()=>{h.scrollIntoView({behavior:"smooth",block:"start"});});
    panel.appendChild(b);
    state.tocButtons.push(b);
  });

}
function setTocCurrent(i){
  if(i===state.tocCurrent)return;
  state.tocCurrent=i;
  state.tocButtons.forEach((b,k)=>b.classList.toggle("toc-active",k===i));
  const btn=state.tocButtons[i], panel=$("toc-panel");
  if(btn && !panel.classList.contains("hidden")){
    // ページ全体を動かさず、目次パネルの中だけでスクロールする
    const top=btn.offsetTop, bottom=top+btn.offsetHeight;
    if(top<panel.scrollTop)panel.scrollTop=Math.max(0,top-8);
    else if(bottom>panel.scrollTop+panel.clientHeight)panel.scrollTop=bottom-panel.clientHeight+8;

}
function setupTocObserver(headings){

  if(!headings.length||!("IntersectionObserver" in window))return;
  const indexOf=new Map(headings.map((h,i)=>[h,i]));

    for(const e of entries){
      const i=indexOf.get(e.target); if(i===undefined)continue;

/* 位置ジャンプ後など、観測が追いつかない場面で現在の見出しを1回計算する */
function syncTocCurrent(){

  const viewer=$("markdown-viewer"), threshold=viewer.getBoundingClientRect().top+viewer.clientHeight*.15;
  let cur=-1;
  for(let i=0;i<state.headings.length;i++){
    if(state.headings[i].getBoundingClientRect().top<=threshold)cur=i; else break;
  }

function updateReadingProgress(){const v=$("markdown-viewer"),max=v.scrollHeight-v.clientHeight;$("reading-progress-fill").style.width=(max>0?Math.max(0,Math.min(100,v.scrollTop/max*100)):0)+"%";}

/* 選択範囲を、文書全体のテキスト上の位置＋前後の文脈つきで記録する（同じ文言が複数あっても正しい場所に付けるため） */
function captureSelectionInfo(){
  const viewer=$("markdown-viewer"), sel=window.getSelection();
  let range=null;
  if(sel && sel.rangeCount && !sel.isCollapsed){
    const r=sel.getRangeAt(0);
    if(viewer.contains(r.commonAncestorContainer))range=r.cloneRange();
  }
  // iOSではボタンを押した瞬間に選択が解除されることがあるため、直前の選択を保持して使う
  if(!range && state.lastSel && Date.now()-state.lastSel.time<20000 && viewer.contains(state.lastSel.range.commonAncestorContainer))range=state.lastSel.range.cloneRange();
  if(!range)return null;
  const raw=range.toString(), trimmed=raw.trim();
  if(!trimmed)return null;
  const quote=trimmed.slice(0,3000);

  const pre=document.createRange();
  pre.setStart(viewer,0); pre.setEnd(range.startContainer,range.startOffset);

    quote, start,
    prefix:full.slice(Math.max(0,start-20),start),
    suffix:full.slice(start+quote.length,start+quote.length+20)

function collectTextNodes(root){

function escapeRegExp(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
/* 注釈の位置を探す：完全一致→前後文脈・元の位置で最有力を選ぶ。旧形式データは空白ゆるめ一致で救済 */
function findAnnotationRange(full,a){
  const q=a.quote; if(!q)return null;

  while((i=full.indexOf(q,from))!==-1){
    let score=0;
    if(a.prefix && full.slice(Math.max(0,i-a.prefix.length),i)===a.prefix)score+=2;
    if(a.suffix && full.slice(i+q.length,i+q.length+a.suffix.length)===a.suffix)score+=2;
    const dist=Number.isFinite(a.start)?Math.abs(i-a.start):i;
    if(score>bestScore||(score===bestScore&&dist<bestDist)){best=i;bestScore=score;bestDist=dist;}
    from=i+1;
  }
  if(best>=0)return {index:best,length:q.length};
  try{
    const m=new RegExp(escapeRegExp(q).replace(/\s+/g,"\\s+")).exec(full);

const STRUCTURAL_TAGS=new Set(["UL","OL","TABLE","THEAD","TBODY","TFOOT","TR"]);
function wrapTextRange(nodes,startPos,endPos,id,className){
  let wrapped=0;

    if(!node.parentNode)continue;
    const text=node.nodeValue;
    if(!text.trim()&&STRUCTURAL_TAGS.has(node.parentNode.nodeName))continue; // リストや表の隙間の空白には付けない
    const localStart=Math.max(startPos,item.start)-item.start;

    if(localEnd<=localStart)continue;
    if(localEnd<text.length)node.splitText(localEnd);
    const target=localStart>0?node.splitText(localStart):node;
    const mark=document.createElement("mark");
    mark.className=className; mark.dataset.annotationId=id;
    target.parentNode.insertBefore(mark,target);

/* 1件の注釈を本文に反映。位置が見つからなければfalse（注釈一覧に「位置不明」と表示） */
function applyOneAnnotation(a){

/* 削除は墓標(deleted:true)として残し、他端末から古い注釈が復活しないようにする */

/* ---- 全文検索（登録文書）：並列取得・進捗表示・永続キャッシュ ---- */
